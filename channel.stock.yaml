# 증시 뉴스 채널 설정 — STUDIO_CHANNEL=stock(작업자: `workroom --channel stock …`)일 때 channel.yaml 대신 읽는다.
# 수집한 글·기사는 data-stock/, 작업 폴더는 projects-stock/에 따로 둔다(정치 채널과 섞이지 않게).
channel:
  name: 증시뉴스 김시연 팀장
  profile: stock               # 대본·주제 규칙 묶음(topicradar/prompts.py STOCK_*)
  youtube_channel_id: ""
  stance: "증시 뉴스 채널. 증권사 리서치센터 팀장이 브리핑하듯 숫자부터 빠르게 전한다. 주제는 기사(국내 증시 마감 시황·업종·종목·금리·환율·정책, 밤사이 미국 증시 마감)로 정하고, 주식 게시판 글은 개인 투자자 분위기로만 짧게. 정치 평가와 투자 권유(사라·팔라·목표가·수익 보장)는 하지 않는다. 여러 이슈를 묶은 10분 시황 브리핑과 이슈 하나를 빠르게 다루는 3분 영상."
  categories: [시황, 종목, 업종, 정책거시, 해외, 공모주]
  competitors: []
  past_titles: []
  slack_webhook: ""

sources:
  # 2026-10 점검: 아래 다섯 피드 모두 접속·항목 확인(연합 120, 한경 50, 매경 50, 머니투데이 100)
  rss:
    - {name: 연합뉴스 마켓, url: "https://www.yna.co.kr/rss/market.xml", kind: domestic, category: 시황}
    - {name: 연합뉴스 경제, url: "https://www.yna.co.kr/rss/economy.xml", kind: domestic, category: 정책거시}
    - {name: 한국경제 증권, url: "https://www.hankyung.com/feed/finance", kind: domestic, category: 종목}
    - {name: 매일경제 증권, url: "https://www.mk.co.kr/rss/50200011/", kind: domestic, category: 종목}
    - {name: 머니투데이 증권, url: "https://rss.mt.co.kr/mt_news_stock.xml", kind: domestic, category: 종목}
  overseas_rss: []
  # 네이버 뉴스 검색어(검색어당 최신 100건) — 시황 숫자와 밤사이 미국 증시를 빠짐없이
  naver_queries: [코스피 마감, 코스닥 마감, 뉴욕증시 마감, 외국인 순매수, 원달러 환율 마감, 기준금리, 반도체주, 2차전지주, 실적 발표 영업이익, 공모주 상장, 공매도, 밸류업]
  kogl: []

images:
  preferred_domains: [krx.co.kr, fss.or.kr, bok.or.kr, go.kr]
  blocked_domains: []
  # 사진에 섞여 나오는 유튜브 썸네일은 뉴스 공식 채널 것만(정치 채널과 같은 규칙 + 경제 방송)
  youtube_thumb_channels: [KBS News, MBCNEWS, MBC 뉴스, SBS 뉴스, JTBC News, YTN, 연합뉴스TV, 연합뉴스 Yonhapnews, MBN News, 채널A 뉴스, TV CHOSUN NEWS, 뉴스TVCHOSUN, KTV 국민방송, 한국경제TV, SBS Biz, 매일경제TV, 머니투데이방송, MTN, 연합뉴스경제TV, 서울경제TV]

videos:
  preferred_channels: [한국경제TV, SBS Biz, 매일경제TV, 머니투데이방송, MTN, 연합뉴스경제TV, 서울경제TV, KTV 국민방송]
  blocked_channels: [KBS News, MBCNEWS, SBS 뉴스, JTBC News, YTN, 연합뉴스TV, TV CHOSUN, 채널A, MBN]   # Content ID 회피

budget:
  google_cse_per_day: 90
  youtube_search_per_day: 80
  naver_per_day: 20000

timeline:
  subtitles: false
  attribution: true

clustering:
  generic_tokens: [코스피, 코스닥, 주가, 증시, 종목, 투자자, 상승, 하락, 마감]

script:
  tone: 애널리스트형            # 빠르고 또렷한 애널리스트 브리핑(topicradar/prompts.py TONES)
  chars_per_minute: 600
  outro: 지금까지 증시뉴스 김시연 팀장이었습니다. 오늘 내용은 투자 권유가 아니며, 투자 판단과 책임은 투자자 본인에게 있습니다. 구독해주시고, 매일 새로운 시장 소식으로 찾아뵙겠습니다.

# 개인 투자자 분위기(짧게만 씀). 사실 근거로는 쓰지 않는다. 2026-10 점검: 두 곳 모두 robots.txt 허용.
# 디시인사이드는 robots.txt가 AI 수집기를 막아 넣지 않는다.
communities:
  - name: 뽐뿌 증권
    list_url: "https://www.ppomppu.co.kr/zboard/zboard.php?id=stock&page={page}"
    post_pattern: "view\\.php\\?id=stock.*?no=\\d+"
    canonical_url: true
    comment_pattern: "class=\"baseList-c\"[^>]*>(\\d+)<"
    vote_pattern: "baseList-rec\" colspan=\"2\">(\\d+)<"
    # 글 상세의 댓글은 화면에서 따로 불러와 읽을 수 없다 → 본문만(버튼 글자가 댓글로 잡히지 않게)
    comment_selector: ".no-such-comment"
    pages: 2
    note: "뽐뿌 증권포럼 — 목록의 댓글 수·추천 수와 본문만"
  - name: 클리앙 주식
    list_url: "https://www.clien.net/service/board/cm_stock"
    post_pattern: "/service/board/cm_stock/\\d+"
    canonical_url: true        # 글 주소의 ?od=… 를 떼야 robots.txt가 허용한다
    body_selector: ".post_article"
    comment_selector: "div.comment_row"
    comment_strip_selector: ".comment_info"
    vote_selector: ".comment_symph"
    pages: 1                   # robots.txt가 '?'가 붙은 주소(2쪽부터)를 막아 첫 쪽만
    note: "클리앙 주식한당"

board:
  window_hours: 24
  min_posts: 1
  size: 20
  derived_queries: 6
