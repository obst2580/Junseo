plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.junseowidget'
version = '0.1.0'

android {
  namespace 'expo.modules.junseowidget'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
}

dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.11.1'
  // SDK 57 publishes Expo modules as precompiled Maven artifacts by default.
  implementation 'host.exp.exponent:expo.modules.notifications:57.0.21'
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
