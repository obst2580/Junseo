<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- BEGIN-CONTENT -->
<title>왕조 연대기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 왼쪽은 사관이 써 내려가는 실록(대화), 오른쪽은 늘 펼쳐 둔 국정 상태창. 아래에 어명을 적는 붓 자리. */
:root {
  --bg: #e7ebe4; --panel: #f4f6f1; --sunk: #dde3da; --ink: #1c2420; --muted: #5e6b63; --line: #c4cdc3;
  --accent: #2b3f91; --accent-ink: #ffffff; --seal: #b8321f; --good: #2c7a4b; --bad: #b8321f; --era: #7a5a12;
  --shadow: 0 1px 0 rgba(28,36,32,.06), 0 6px 18px -10px rgba(28,36,32,.25);
  --f-display: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --panel: #181e27; --sunk: #0d1117; --ink: #e4e7e0; --muted: #98a39c; --line: #2a3340;
    --accent: #93a6f2; --accent-ink: #0f1424; --seal: #e0654f; --good: #6cc68f; --bad: #ef7a64; --era: #e0b65a;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181e27; --sunk: #0d1117; --ink: #e4e7e0; --muted: #98a39c; --line: #2a3340;
  --accent: #93a6f2; --accent-ink: #0f1424; --seal: #e0654f; --good: #6cc68f; --bad: #ef7a64; --era: #e0b65a;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 190px;
}
button, textarea, input { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; padding-block: 20px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
.seal { width: 46px; height: 46px; flex: none; border: 2px solid var(--seal); color: var(--seal); display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; line-height: 1.05; text-align: center; border-radius: 4px; transform: rotate(-4deg); }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 4vw, 32px); line-height: 1.15; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 13px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; }
.btn-ghost:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.btn-ghost[disabled] { opacity: .4; cursor: not-allowed; }
.sync { font-size: 12px; color: var(--muted); background: transparent; border: 0; padding: 6px 2px; cursor: default; }
.sync.warn { color: var(--bad); }
.sync.remote { color: var(--accent-ink); background: var(--accent); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
.saves { display: flex; flex-direction: column; gap: 6px; }
.save-row { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.save-row:hover { border-color: var(--accent); }
.save-row b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.save-row span { font-size: 12px; color: var(--muted); }
.only-narrow { display: none; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }

/* 실록 */
.log { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.turn-cmd { align-self: flex-end; max-width: min(560px, 88%); background: var(--accent); color: var(--accent-ink); padding: 9px 14px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.turn-cmd .lbl { display: block; font-size: 11px; letter-spacing: .1em; opacity: .75; }
.turn-gm { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; overflow-wrap: anywhere; }
.turn-gm .date { font-family: var(--f-display); color: var(--era); font-size: 17px; margin-bottom: 6px; }
.turn-gm p { margin: 0 0 .8em; max-width: 68ch; }
.turn-gm p:last-child { margin-bottom: 0; }
.turn-gm h4 { margin: 1em 0 .4em; font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.turn-gm h4:first-child { margin-top: 0; }
.turn-gm blockquote { margin: 0 0 .8em; padding: 4px 0 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.turn-gm ul { margin: 0 0 .8em; padding-left: 20px; }
.turn-gm.pending .think { color: var(--muted); font-style: italic; }
.turn-gm .note { margin-top: 10px; font-size: 12.5px; color: var(--bad); }
.turn-end { border-color: var(--era); }
.turn-end h3 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--era); }
.intro { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 16px 18px; color: var(--muted); font-size: 14px; }
.intro b { color: var(--ink); }

/* 상태창 */
.status { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 210px); overflow-y: auto; min-width: 0; }
.status h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.25; }
.status .when { font-family: var(--f-num); font-size: 12.5px; color: var(--era); }
.status .headline { font-size: 13.5px; color: var(--muted); }
.sec-label { font-size: 11px; letter-spacing: .12em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.gauges { display: flex; flex-direction: column; gap: 7px; }
.g-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 13px; }
.g-bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.g-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
.g-bar i.low { background: var(--bad); }
.g-val { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; font-size: 12.5px; white-space: nowrap; }
.g-val .up { color: var(--good); } .g-val .down { color: var(--bad); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fact { background: var(--bg); border-radius: 6px; padding: 6px 9px; min-width: 0; }
.fact .k { display: block; font-size: 11px; color: var(--muted); }
.fact .v { display: block; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.list li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.list li > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.list small { color: var(--muted); display: block; font-size: 11.5px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; flex: none; }
.t-good { color: var(--good); } .t-bad { color: var(--bad); } .t-mid { color: var(--muted); }
.t-war { color: var(--panel); background: var(--seal); border-color: var(--seal); }
.threats li { justify-content: flex-start; color: var(--bad); }
.chron { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; margin: 0; padding-left: 16px; }
.empty-status { color: var(--muted); font-size: 13.5px; }

/* 어명 입력 */
.composer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 95%, transparent); backdrop-filter: blur(6px);
  border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.composer-in { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip { flex: none; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.chip:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.chip.time { border-color: var(--era); color: var(--era); }
.chip[disabled] { opacity: .45; cursor: not-allowed; }
.row-in { display: flex; gap: 8px; align-items: flex-end; }
.row-in textarea { flex: 1; min-width: 0; resize: none; min-height: 46px; max-height: 160px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); line-height: 1.5; }
.btn-send { background: var(--seal); color: #fff; border: 0; border-radius: 10px; padding: 0 18px; height: 46px; cursor: pointer; font-family: var(--f-display); font-size: 18px; flex: none; }
.btn-send[disabled] { opacity: .45; cursor: not-allowed; }
.btn-stop { background: var(--ink); color: var(--bg); }
.hint { font-size: 11.5px; color: var(--muted); }

/* 모달 */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10,14,12,.55); display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(680px, 100%); padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }
.modal h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.2; }
.modal p { margin: 0; color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; color: var(--muted); }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preset { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.preset.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset b { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.preset .yr { font-family: var(--f-num); font-size: 11.5px; color: var(--era); }
.preset span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; line-height: 1.5; }
.field textarea { resize: vertical; min-height: 64px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 7px 4px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.mrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 700; }
.btn-primary[disabled] { opacity: .4; cursor: not-allowed; }
.warnbox { font-size: 13px; color: var(--bad); }

/* 답변 아래 상태창 */
.st-inline { margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 14px; }
.st-inline summary { cursor: pointer; padding: 9px 0; font-family: var(--f-display); font-size: 16px; color: var(--era); }
.st-inline[open] { padding-bottom: 12px; }
.st-inline .hl { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.sc-gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; }
.sc-g { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 6px; font-size: 12.5px; align-items: baseline; }
.sc-g .g-bar { grid-column: 1 / -1; }
.sc-g .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.sc-g .up, .sc-g .down { font-size: 11px; margin-left: 4px; }
.sc-g .up { color: var(--good); } .sc-g .down { color: var(--bad); }
.sc-facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; margin-top: 12px; }
.sc-facts b { font-weight: 500; color: var(--muted); }
.sc-line { font-size: 12.5px; margin-top: 8px; overflow-wrap: anywhere; line-height: 1.9; }
.sc-line .lbl { color: var(--muted); margin-right: 4px; }
.sc-line.threat { color: var(--bad); }
.st-missing { margin-top: 12px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .status { display: none; }
  .only-narrow { display: inline-block; }
  .presets, .fields { grid-template-columns: 1fr; }
}
@media (max-width: 520px) { .sc-gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { .g-bar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">王朝<br>實錄</div>
      <div>
        <h1 id="title">왕조 연대기</h1>
        <div class="sub" id="subtitle">어명을 내리면 AI 사관이 역사를 써 내려가는 대체역사 국가 경영</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="sync" id="sync" type="button" tabindex="-1">이 기기에만 저장</button>
      <button class="btn-ghost only-narrow" id="btn-status" type="button">상태창</button>
      <button class="btn-ghost" id="btn-undo" type="button" disabled>한 턴 되돌리기</button>
      <button class="btn-ghost" id="btn-new" type="button">새 시나리오</button>
    </div>
  </header>

  <main class="cols">
    <section class="log" id="log" aria-live="polite"></section>
    <aside class="status" id="status" aria-label="상태창"></aside>
  </main>
</div>

<div class="composer">
  <div class="composer-in">
    <div class="chips" id="chips"></div>
    <div class="row-in">
      <label for="cmd" class="hint" hidden>어명</label>
      <textarea id="cmd" rows="1" placeholder="어명을 적으십시오. 예: 재무대신을 불러 철도 건설 예산을 보고하게 하라"></textarea>
      <button class="btn-send" id="btn-send" type="button">어명</button>
    </div>
    <div class="hint" id="hint">Enter로 보내고 Shift+Enter로 줄을 바꿉니다. 게임 밖 요청은 (OOC: …)로 적으세요.</div>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SAVE_KEY = "dynasty-ai-v1";
const GAUGES = ["안정도", "재정", "군사력", "산업", "민심", "국제 위상"];

const PRESETS = [
  { id: "ru", nation: "러시아 제국", date: "1894년 11월", role: "황제 니콜라이 2세", premise: "아버지 알렉산드르 3세가 갑자기 세상을 떠나 스물여섯의 니콜라이가 제위에 올랐다. 산업은 서유럽에 뒤처졌고 혁명 세력이 지하에서 자라며, 극동에서는 일본이 떠오르고 있다.", goal: "혁명과 패전을 피하고 제국을 근대 강국으로 만든다" },
  { id: "jo", nation: "조선", date: "1863년 12월", role: "국왕 (어린 고종, 흥선대원군 섭정)", premise: "열두 살 어린 왕이 즉위하고 흥선대원군이 섭정을 맡았다. 서양 함선이 해안에 나타나고 청은 흔들리며 세도 정치의 폐단이 쌓여 있다.", goal: "외세의 침탈을 막고 자주적인 근대화를 이룬다" },
  { id: "kr", nation: "대한제국", date: "1897년 10월", role: "황제 고종 (광무제)", premise: "환구단에서 황제 즉위식을 올리고 국호를 대한으로 고쳤다. 러시아와 일본이 한반도를 두고 맞서고 있다.", goal: "열강 사이에서 독립을 지키고 광무개혁을 완수한다" },
  { id: "by", nation: "동로마 제국", date: "1449년 1월", role: "황제 콘스탄티노스 11세", premise: "제국은 콘스탄티노폴리스와 펠로폰네소스 일부만 남았다. 오스만에서는 야심 찬 젊은 왕자가 즉위를 기다리고 있다.", goal: "수도를 지키고 제국을 되살린다" },
  { id: "fr", nation: "프랑스 왕국", date: "1789년 5월", role: "국왕 루이 16세", premise: "재정 파탄 끝에 175년 만에 삼부회가 소집되었다. 빵값은 치솟고 제3신분은 분노하고 있다.", goal: "혁명을 막거나 이끌어 왕국을 살린다" },
  { id: "cn", nation: "청", date: "1898년 6월", role: "광서제", premise: "청일전쟁 패배 뒤 젊은 황제가 변법 개혁을 선포하려 한다. 서태후와 보수파가 지켜보고 있다.", goal: "변법을 성공시키고 열강의 분할을 막는다" },
];
const REALISM = {

async function initCloud() {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const uid = await user.id();

  try {
    const cur = await db.doc(cloud.base + "/current").get();
    const c = cur.exists ? cur.data() : null;
    const localT = G && G.turns.length ? (G.updatedAt || 0) : -1;
    if (!c) { if (G) cloudSave(); }
    else if (G && c.gid === G.gid) {
      if (localT > (c.updatedAt || 0)) cloudSave();
      else if (localT < (c.updatedAt || 0)) { if (!busy) await pull(c.gid, true); }
      else { cloud.gid = G.gid; cloud.synced = G.turns.length; }
    }
    else if (localT > (c.updatedAt || 0)) cloudSave();

    setSync("모든 기기에 저장됨");

}
async function pull(gid, announce) {
  const ref = cloud.db.doc(`${cloud.base}/g_${gid}`);
  const m = await ref.get();
  if (!m.exists) return false;
  const d = m.data();
  const q = await ref.collection("turns").orderBy("i").limit(1000).get();
  const n = d.nTurns ?? 1e9;
  G = { gid, sc: d.sc, realism: d.realism || "balanced", state: d.state ?? null, prevState: d.prevState ?? null, chronicle: d.chronicle || [], ended: d.ended ?? null, updatedAt: d.updatedAt || 0, undo: null,
    turns: q.docs.map(x => x.data()).filter(t => t.i < n).map(t => ({ role: t.role, content: t.content, date: t.date || "", st: t.st || null })) };
  cloud.gid = gid; cloud.synced = G.turns.length; cloud.remote = null;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {}

function cloudSave() {
  if (!cloud || !G) return;
  const g = G;
  saving = saving.then(async () => {
    setSync("저장 중…");

    if (cloud.gid !== g.gid) { cloud.gid = g.gid; cloud.synced = 0; }
    const n = g.turns.length;

      const t = g.turns[i];
      await ref.collection("turns").doc(padT(i)).set({ i, role: t.role, content: t.content, date: t.date || "", st: t.st || null });
    }

    cloud.lastWrite = g.updatedAt;

// 상태창이 시작되는 위치: <state> 태그, "gauges"가 든 코드블록, 또는 맨 끝의 JSON 객체
function stateStart(text) {
  const i = text.indexOf("<state");
  if (i >= 0) return i;
  const g = text.indexOf('"gauges"');
  if (g < 0) return -1;
  const fence = text.lastIndexOf("```", g);
  const brace = text.lastIndexOf("{", g);
  return fence >= 0 && fence < brace ? fence : brace;
}
function splitReply(text) {
  const s = stateStart(text);
  if (s < 0) return { narrative: text.trim(), state: null };
  let narrative = text.slice(0, s).replace(/(\n\s*(#+\s*)?(\*\*)?상태창(\*\*)?\s*:?\s*)$/, "").trim();
  const body = text.slice(s).replace(/<\/?state>/g, "").replace(/```(json)?/g, "");
  const a = body.indexOf("{"), b = body.lastIndexOf("}");
  let state = null;
  if (a >= 0 && b > a) { try { state = JSON.parse(body.slice(a, b + 1)); } catch (e) { state = null; } }
  return { narrative, state };
}
// 답에서 상태창을 못 읽었을 때: 서술을 근거로 상태창만 다시 만든다

${STATE_SPEC.replace(/<\/?state>/g, "")}`;

function cleanState(s) {

/* 아주 작은 마크다운 */
function md(src) {
  const lines = esc(src).split(/\n/);
  let html = "", para = [], list = [];
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
  const flushL = () => { if (list.length) { html += `<ul>${list.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`; list = []; } };
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) { flushP(); flushL(); continue; }
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)$/))) { flushP(); flushL(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = l.match(/^[-*•]\s+(.*)$/))) { flushP(); list.push(m[1]); }
    else if ((m = l.match(/^&gt;\s?(.*)$/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if (/^-{3,}$/.test(l)) { flushP(); flushL(); }
    else { flushL(); para.push(l); }
  }
  flushP(); flushL();
  return html;
}

    ${st.threats.length ? `<div class="sc-line threat"><span class="lbl">위협</span>${st.threats.map(esc).join(" · ")}</div>` : ""}
    ${st.figures.length ? `<div class="sc-line"><span class="lbl">인물</span>${st.figures.map(f => `${esc(f.name)} <span class="tag ${moodTag(f.mood)}">${esc(f.mood)}</span>`).join(" ")}</div>` : ""}
    ${st.relations.length ? `<div class="sc-line"><span class="lbl">외교</span>${st.relations.map(r => `${esc(r.nation)} <span class="tag ${relTag(r.status)}">${esc(r.status)}</span>`).join(" ")}</div>` : ""}
  </details>`;
}
const moodTag = m => /충성|우호/.test(m) ? "t-good" : /불만|적대/.test(m) ? "t-bad" : "t-mid";
const relTag = s => /전쟁/.test(s) ? "t-war" : /동맹|우호/.test(s) ? "t-good" : /긴장|적대/.test(s) ? "t-bad" : "t-mid";
function renderStatus() {
  const el = $("#status"), st = G?.state;
  const collapsed = el.classList.contains("collapsed");
  if (!st) {
    el.innerHTML = `<div class="st-head"><h2>상태창</h2></div><div class="empty-status">첫 어명을 내리면 국가 현황이 여기에 기록됩니다. 아래 ‘즉위한다’를 누르거나 원하는 명령을 적어 보세요.</div>`;
    return;
  }
  el.innerHTML = `<div class="st-head"><div class="when">${esc(st.date)}</div><h2>${esc(G.sc.nation)}</h2><div class="headline">${esc(st.ruler)}${st.headline ? " · " + esc(st.headline) : ""}</div></div>
    <div class="gauges">${GAUGES.map(k => { const v = st.gauges[k]; return `<div class="g-row"><span>${k}</span><div class="g-bar"><i class="${v < 30 ? "low" : ""}" style="width:${v}%"></i></div><span class="g-val">${v} ${trend(k)}</span></div>`; }).join("")}</div>
    ${st.facts.length ? `<div class="sec-label">국정 지표</div><div class="facts">${st.facts.map(f => `<div class="fact"><span class="k">${esc(f.k)}</span><span class="v">${esc(f.v)}</span></div>`).join("")}</div>` : ""}
    ${st.threats.length ? `<div class="sec-label">위협</div><ul class="list threats">${st.threats.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    ${st.figures.length ? `<div class="sec-label">주요 인물</div><ul class="list">${st.figures.map(f => `<li><span>${esc(f.name)}<small>${esc(f.role)}</small></span><span class="tag ${moodTag(f.mood)}">${esc(f.mood)}</span></li>`).join("")}</ul>` : ""}
    ${st.relations.length ? `<div class="sec-label">외교</div><ul class="list">${st.relations.map(r => `<li><span>${esc(r.nation)}${r.note ? `<small>${esc(r.note)}</small>` : ""}</span><span class="tag ${relTag(r.status)}">${esc(r.status)}</span></li>`).join("")}</ul>` : ""}
    ${G.chronicle.length ? `<div class="sec-label">연대기 (최근 ${Math.min(8, G.chronicle.length)}건 / 전체 ${G.chronicle.length}건)</div><ol class="chron">${G.chronicle.slice(-8).reverse().map(c => `<li>${esc(c)}</li>`).join("")}</ol>` : ""}`;
  if (collapsed) el.classList.add("collapsed");
}
function renderChips() {
  const c = $("#chips");
  if (!G) { c.innerHTML = ""; return; }
  const dis = busy || G.ended || !sampleReady ? "disabled" : "";
  let opts = [];
  if (!G.turns.length) opts = ["즉위한다. 조정의 현황을 보고받는다"];
  else opts = [...(G.state?.options || []), "한 달을 보낸다", "1년을 넘기며 결과를 보고받는다"];
  c.innerHTML = opts.map((o, i) => `<button class="chip ${/넘기|보낸다/.test(o) && i >= (G.state?.options?.length || 0) ? "time" : ""}" type="button" data-chip="${esc(o)}" title="${esc(o)}" ${dis}>${esc(o)}</button>`).join("");
  $("#btn-send").disabled = !!G.ended || !sampleReady;
  if (busy) { $("#btn-send").disabled = false; }
}

/* ───────── 전송 ───────── */
const ERR = {
  not_granted: "이 페이지가 Claude를 쓰도록 허용되지 않았습니다. 허용해야 사관이 이야기를 이어 갈 수 있습니다.",
  sampling_disabled: "이 계정에서는 Claude를 쓸 수 없습니다.",
  rate_limited: "요청이 너무 많거나 사용량 한도에 닿았습니다. 잠시 뒤에 다시 보내 주세요.",
  session_expired: "로그인이 만료되었습니다. 다시 로그인한 뒤 보내 주세요.",
  refused: "사관이 이 명령을 서술하지 않았습니다. 표현을 바꿔 다시 내려 주세요.",
  prompt_too_large: "기록이 너무 길어졌습니다. 새 시나리오로 시작하거나 되돌려 주세요.",
  empty_completion: "답이 비어 있습니다. 다시 보내 주세요.",
};
async function send(cmd) {
  cmd = (cmd || "").trim();
  if (!cmd || busy || !G || G.ended) return;
  if (!sampleReady) { setHint("AI 사관은 claude.ai에서 이 페이지를 열었을 때만 응답합니다.", true); return; }
  const input = buildInput(cmd);
  const snapshot = JSON.stringify({ turns: G.turns, state: G.state, prevState: G.prevState, chronicle: G.chronicle, ended: G.ended });
  G.turns.push({ role: "user", content: "[플레이어] " + cmd });
  $("#cmd").value = ""; autoGrow();
  render();
  const pend = document.createElement("article");
  pend.className = "turn-gm pending";
  pend.innerHTML = `<div class="think">사관이 붓을 드는 중…</div>`;
  $("#log").appendChild(pend);
  pend.scrollIntoView({ block: "nearest", behavior: "smooth" });
  busy = new AbortController();
  setBusyUI(true);
  try {
    const { text, truncated } = await sample(input, {
      signal: busy.signal, cache: false,
      onText: ({ text }) => {
        const s = stateStart(text); const n = (s >= 0 ? text.slice(0, s) : text).trim();
        if (n) pend.innerHTML = md(n) + (s >= 0 ? `<div class="st-missing">상태창을 정리하는 중…</div>` : "");
      },
    });
    const { narrative, state } = splitReply(text);
    let cs = cleanState(state);
    if (!cs && narrative) {
      pend.innerHTML = md(narrative) + `<div class="st-missing">상태창을 정리하는 중…</div>`;
      try { cs = cleanState(await recoverState(narrative)); } catch (e) { cs = null; }
    }
    G.undo = snapshot;
    if (cs) {
      G.prevState = G.state; G.state = cs;
      cs.events.forEach(e => G.chronicle.push(e));
      if (G.chronicle.length > 200) G.chronicle = G.chronicle.slice(-200);
      if (cs.ending) G.ended = cs.ending;
    }
    G.turns.push({ role: "assistant", content: narrative || text, date: cs?.date || G.state?.date || "", st: cs || null });
    save();
    busy = null; setBusyUI(false); render();
    if (!cs) setHint("이번 답에서 상태창을 읽지 못해 이전 상태창을 유지했습니다.", true);
    else if (truncated) setHint("답이 길이 제한에서 잘렸습니다.", true);
    else setHint();
    const last = $("#log").lastElementChild; if (last) last.scrollIntoView({ block: "start", behavior: "smooth" });
  } catch (e) {
    busy = null; setBusyUI(false);
    // 실패한 어명은 되돌리고 입력창에 다시 넣는다
    const snap = JSON.parse(snapshot); Object.assign(G, snap);
    render();
    if (e?.code !== "cancelled") { $("#cmd").value = cmd; autoGrow(); setHint(ERR[e?.code] || "연결이 끊겼습니다. 다시 보내 주세요.", true); }
    else { $("#cmd").value = cmd; setHint("멈췄습니다."); }
  }
}
function setBusyUI(on) {
  const b = $("#btn-send");
  b.textContent = on ? "멈춤" : "어명"; b.classList.toggle("btn-stop", on);
  $("#btn-undo").disabled = on || !G?.undo;
  $("#btn-new").disabled = on;
  renderChips();
}
function setHint(t, warn) { const h = $("#hint"); h.textContent = t || "Enter로 보내고 Shift+Enter로 줄을 바꿉니다. 게임 밖 요청은 (OOC: …)로 적으세요."; h.style.color = warn ? "var(--bad)" : ""; }
function undo() {
  if (!G?.undo || busy) return;
  const snap = JSON.parse(G.undo);
  const lastCmd = [...G.turns].reverse().find(t => t.role === "user");
  Object.assign(G, snap); G.undo = null; save(); render();
  if (lastCmd) { $("#cmd").value = lastCmd.content.replace(/^\[플레이어\]\s*/, ""); autoGrow(); }
  setHint("한 턴을 되돌렸습니다. 어명을 고쳐 다시 내릴 수 있습니다.");
}

/* ───────── 시나리오 선택 ───────── */
function showSetup() {
  const p = PRESETS.find(x => x.id === pick.preset);
  const custom = pick.preset === "custom";
  $("#modal").innerHTML = `<div id="saves"></div><div class="eyebrow">새 시나리오</div><h3>어느 나라의 운명을 쥘 것인가</h3>
    <p>시대와 나라를 고르면 AI 사관이 그 시점의 실제 역사에서 이야기를 시작합니다. 명령은 채팅으로 자유롭게 내리면 됩니다.</p>
    <div class="presets">${PRESETS.map(x => `<button type="button" class="preset ${x.id === pick.preset ? "on" : ""}" data-preset="${x.id}"><span class="yr">${x.date}</span><b>${x.nation}</b><span>${esc(x.role)}</span></button>`).join("")}
      <button type="button" class="preset ${custom ? "on" : ""}" data-preset="custom"><span class="yr">직접 입력</span><b>나만의 대체역사</b><span>나라, 시점, 분기점을 직접 정한다</span></button></div>
    <div class="fields">
      <div class="field"><label for="f-nation">국가</label><input id="f-nation" value="${esc(custom ? "" : p.nation)}" placeholder="예: 고려"></div>
      <div class="field"><label for="f-date">시작 시점</label><input id="f-date" value="${esc(custom ? "" : p.date)}" placeholder="예: 1231년 8월"></div>
      <div class="field full"><label for="f-role">플레이어의 역할</label><input id="f-role" value="${esc(custom ? "" : p.role)}" placeholder="예: 국왕 고종 / 무신 집정 최우"></div>
      <div class="field full"><label for="f-premise">배경과 분기점</label><textarea id="f-premise" placeholder="예: 몽골의 1차 침입 직전. 강화 천도를 하지 않았다면?">${esc(custom ? "" : p.premise)}</textarea></div>
      <div class="field full"><label for="f-goal">목표</label><input id="f-goal" value="${esc(custom ? "" : p.goal)}" placeholder="예: 몽골을 물리치고 왕권을 되찾는다"></div>
      <div class="field full"><label>난이도</label><div class="seg">${Object.entries(REALISM).map(([k, r]) => `<button type="button" data-real="${k}" class="${pick.realism === k ? "on" : ""}">${r.name}</button>`).join("")}</div></div>
    </div>
    ${sampleReady ? "" : `<div class="warnbox">AI 사관은 claude.ai에서 이 페이지를 열었을 때만 응답합니다. 처음 어명을 내릴 때 Claude 사용 허용을 묻습니다.</div>`}
    <div class="mrow">${G ? `<button class="btn-ghost" type="button" data-act="close">닫기</button>` : ""}<button class="btn-primary" type="button" data-act="start">이 나라로 시작</button></div>`;
  $("#scrim").hidden = false;
  fillSaves();
}
function startFromForm() {
  const v = id => ($("#" + id).value || "").trim();
  const sc = { nation: v("f-nation"), date: v("f-date"), role: v("f-role"), premise: v("f-premise") || "실제 역사 그대로 시작한다.", goal: v("f-goal") || "나라를 번영시킨다" };
  if (!sc.nation || !sc.date || !sc.role) { const w = $("#modal .warnbox") || Object.assign(document.createElement("div"), { className: "warnbox" }); w.textContent = "국가, 시작 시점, 역할을 채워 주세요."; $("#modal .mrow").before(w); return; }
  G = blankGame(sc, pick.realism); save();
  $("#scrim").hidden = true; render(); setHint();
  window.scrollTo({ top: 0 });
  $("#cmd").focus();
}

/* ───────── 입력 ───────── */
function autoGrow() { const t = $("#cmd"); t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; }
$("#cmd").addEventListener("input", autoGrow);
$("#cmd").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!busy) send($("#cmd").value); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (t.id === "btn-send") { if (busy) busy.abort(); else send($("#cmd").value); return; }
  if (t.id === "btn-undo") return undo();
  if (t.id === "btn-new" || d.act === "new") return showSetup();
  if (t.id === "btn-status") {
    const cards = document.querySelectorAll(".st-inline"); const c = cards[cards.length - 1];
    if (c) { c.open = true; c.scrollIntoView({ block: "center", behavior: "smooth" }); } else setHint("첫 어명을 내리면 답변 아래에 상태창이 나옵니다.");
    return;
  }
  if (d.chip) return send(d.chip);
  if (d.preset) { pick.preset = d.preset; return showSetup(); }
  if (d.real) { pick.realism = d.real; document.querySelectorAll("[data-real]").forEach(b => b.classList.toggle("on", b.dataset.real === pick.realism)); return; }
  if (d.act === "close") { $("#scrim").hidden = true; return; }
  if (d.act === "start") return startFromForm();
  if (d.load && cloud && !busy) { pull(d.load, true).then(ok => { if (ok) save(); }); return; }
  if (t.id === "sync" && cloud?.remote && !busy) { pull(cloud.remote, true); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scrim").hidden && G) $("#scrim").hidden = true; });

/* ───────── 시작 ───────── */
(function boot() {
  G = load();
  if (G && !G.gid) { G.gid = newGid(); G.updatedAt = G.turns?.length ? Date.now() : 0; try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
  render();
  if (!G) showSetup();
  const use = window.claude?.use;
  if (use) {
    window.claude.use("sample").then(fn => {
      sample = fn; sampleReady = !!fn;
      if (!fn) setHint("이 화면에서는 AI 사관을 부를 수 없습니다. claude.ai에서 열어 주세요.", true);
      render();
      if (!$("#scrim").hidden && !G) showSetup();
    }).catch(() => { setHint("AI 사관을 불러오지 못했습니다.", true); });
    initCloud().catch(() => setSync("동기화 실패 · 이 기기에만 저장", "warn"));
  } else {
    setHint("AI 사관은 claude.ai에서 이 페이지를 열었을 때만 응답합니다.", true);
  }
})();
</script>
