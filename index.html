<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- BEGIN-CONTENT -->
<title>왕조 연대기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 사관이 쓰는 실록 — 위에는 국력 장부, 가운데 세 단(국정 · 연대기 · 주변국), 아래에 붉은 인장 같은 '한 해를 마친다' 버튼 */
:root {
  --bg: #e7ebe4;          /* 옅은 청자빛 한지 */
  --panel: #f4f6f1;
  --sunk: #dde3da;
  --ink: #1c2420;
  --muted: #5e6b63;
  --line: #c4cdc3;
  --accent: #2b3f91;      /* 쪽빛 */
  --accent-ink: #ffffff;
  --seal: #b8321f;        /* 인주 */
  --good: #2c7a4b;
  --bad: #b8321f;
  --era: #7a5a12;
  --shadow: 0 1px 0 rgba(28,36,32,.06), 0 6px 18px -10px rgba(28,36,32,.25);
  --f-display: "Song Myung", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --panel: #181e27; --sunk: #0d1117; --ink: #e4e7e0; --muted: #98a39c;
    --line: #2a3340; --accent: #93a6f2; --accent-ink: #0f1424; --seal: #e0654f;
    --good: #6cc68f; --bad: #ef7a64; --era: #e0b65a;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181e27; --sunk: #0d1117; --ink: #e4e7e0; --muted: #98a39c;
  --line: #2a3340; --accent: #93a6f2; --accent-ink: #0f1424; --seal: #e0654f;
  --good: #6cc68f; --bad: #ef7a64; --era: #e0b65a;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* 머리 */
header.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px;
  padding-block: 20px 4px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
.seal {
  width: 46px; height: 46px; flex: none; border: 2px solid var(--seal); color: var(--seal);
  display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; line-height: 1.05;
  text-align: center; border-radius: 4px; transform: rotate(-4deg); padding: 2px;
}
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); line-height: 1.1; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 13px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* 국력 장부 */
.ledger { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.res { background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.res .k { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.res .v { font-family: var(--f-num); font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.res .d { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d.up { color: var(--good); } .d.down { color: var(--bad); }
.res.warn .v { color: var(--bad); }
.meter { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.meter.mood > i { background: var(--good); }
.meter.mood.low > i { background: var(--bad); }

/* 시대 띠 */
.eras { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.era-track { display: flex; gap: 4px; flex: 1 1 420px; min-width: 0; }
.era-step { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.era-step.done { background: color-mix(in srgb, var(--era) 18%, var(--panel)); color: var(--era); }
.era-step.now { background: var(--era); color: var(--panel); font-weight: 700; }
.era-info { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-era { background: var(--era); color: var(--panel); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
.btn-era[disabled] { opacity: .35; cursor: not-allowed; }

/* 세 단 */
.cols { display: grid; grid-template-columns: 300px minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.group-label { font-size: 11px; letter-spacing: .1em; color: var(--muted); }

.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act {
  text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.act:hover:not([disabled]) { border-color: var(--accent); }
.act b { font-weight: 700; font-size: 14px; }
.act span { font-size: 11.5px; color: var(--muted); }
.act[disabled] { opacity: .45; cursor: not-allowed; }
.act.wide { grid-column: 1 / -1; }
.act.gold { border-color: var(--era); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 7px 4px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.bld-list { display: flex; flex-wrap: wrap; gap: 6px; }
.bld-chip { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.bld-chip b { color: var(--ink); font-family: var(--f-num); }

/* 연대기 */
.chron { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; max-height: 62vh; overflow-y: auto; }
.chron li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.chron li:last-child { border-bottom: 0; }
.chron .y { font-family: var(--f-num); font-size: 12px; color: var(--muted); padding-top: 2px; }
.chron .t { min-width: 0; overflow-wrap: anywhere; }
.chron li.good .t { color: var(--good); }
.chron li.bad .t { color: var(--bad); }
.chron li.war .t { color: var(--seal); font-weight: 500; }
.chron li.era .t { font-family: var(--f-display); font-size: 17px; color: var(--era); }
.chron li.year-mark { border-bottom: 0; padding-bottom: 0; }

/* 주변국 */
.nb { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.nb.dead { opacity: .55; }
.nb-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.nb-name { font-family: var(--f-display); font-size: 17px; line-height: 1.2; }
.nb-ruler { font-size: 12px; color: var(--muted); }
.pill { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid currentColor; }
.pill.peace { color: var(--muted); }
.pill.ally { color: var(--good); }
.pill.war { color: var(--panel); background: var(--seal); border-color: var(--seal); }
.pill.dead { color: var(--muted); }
.nb-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; color: var(--muted); }
.nb-stats b { display: block; font-family: var(--f-num); color: var(--ink); font-size: 14px; font-weight: 500; }
.rel { height: 6px; border-radius: 3px; background: var(--sunk); position: relative; }
.rel::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.rel > i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.nb-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.mini:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
.mini.danger { color: var(--seal); border-color: color-mix(in srgb, var(--seal) 50%, var(--line)); }
.mini[disabled] { opacity: .4; cursor: not-allowed; }

/* 하단 바 */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ap i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.ap i.on { background: var(--accent); }
.btn-end {
  background: var(--seal); color: #fff; border: 0; border-radius: 8px; padding: 11px 20px; cursor: pointer;
  font-family: var(--f-display); font-size: 18px; letter-spacing: .04em;
}
.btn-end:hover { filter: brightness(1.08); }

/* 모달 */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10,14,12,.55); display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }
.modal h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.modal .eyebrow { font-size: 11.5px; letter-spacing: .12em; color: var(--muted); }
.modal p { margin: 0; max-width: 62ch; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.choice:hover:not([disabled]) { border-color: var(--accent); }
.choice b { font-weight: 700; }
.choice span { font-size: 12.5px; color: var(--muted); }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 11px 18px; cursor: pointer; font-weight: 700; font-size: 15px; }
.btn-primary[disabled] { opacity: .4; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit; color: var(--ink); }
.traits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.trait { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.trait.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.trait b { font-family: var(--f-display); font-weight: 400; font-size: 16px; }
.trait span { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.help h4 { margin: 4px 0 0; font-size: 14px; }
.help ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.statgrid div { background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.statgrid b { display: block; color: var(--ink); font-family: var(--f-num); font-size: 16px; font-weight: 500; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }

@media (max-width: 1080px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cols .p-chron { grid-column: 1 / -1; order: 3; }
  .ledger { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .ledger { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ledger .res:last-child { grid-column: span 2; }
  .traits { grid-template-columns: 1fr; }
  .btn-end { font-size: 16px; padding: 10px 14px; }
  .chron { max-height: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .chron li.fresh { animation: inkin .6s ease-out; }
  @keyframes inkin { from { opacity: .2; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" id="seal" aria-hidden="true">王朝<br>實錄</div>
      <div>
        <h1 id="title">왕조 연대기</h1>
        <div class="sub" id="subtitle">작은 부족에서 세계를 이끄는 나라까지</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn-ghost" id="btn-help" type="button">규칙</button>
      <button class="btn-ghost" id="btn-new" type="button">새 왕조</button>
    </div>
  </header>

  <section class="ledger" id="ledger" aria-label="국력"></section>

  <section class="eras" id="eras" aria-label="시대"></section>

  <main class="cols">
    <section class="panel p-gov" id="gov"></section>
    <section class="panel p-chron">
      <h2>연대기 <small id="chron-meta"></small></h2>
      <ol class="chron" id="chron"></ol>
    </section>
    <section class="panel p-nb" id="nbs"></section>
  </main>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="ap" id="ap"></div>
    <button class="btn-end" id="btn-end" type="button">한 해를 마친다</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ───────── 기본 도구 ───────── */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v);
const SAVE_KEY = "dynasty-chronicle-v1";

/* ───────── 설정 데이터 ───────── */
const ERAS = [
  { name: "부족 시대", need: 0,   mult: 1.0, intro: "불씨를 지키던 부족이 처음으로 깃발을 세웠다." },
  { name: "고대",     need: 30,  mult: 1.3, intro: "문자가 생기고 성읍이 들어섰다. 이제 법과 제도가 나라를 다스린다." },
  { name: "중세",     need: 90,  mult: 1.7, intro: "성곽과 기사, 그리고 신앙의 시대가 열렸다." },
  { name: "르네상스", need: 180, mult: 2.2, intro: "인쇄된 책과 먼바다의 항로가 세상을 넓혔다." },
  { name: "산업 시대", need: 320, mult: 2.9, intro: "증기기관이 들판을 울린다. 도시는 밤에도 잠들지 않는다." },
  { name: "근대",     need: 500, mult: 3.8, intro: "철도와 전신이 나라를 하나로 묶었다. 온 세계가 이 나라를 주목한다." },
];
const TRAITS = {
  agri:     { name: "농경의 나라", desc: "농장마다 식량 +2 · 시작 식량 +30", apply: s => { s.food += 30; } },
  commerce: { name: "상업의 나라", desc: "금 수입 +20% · 시작 금 +40",       apply: s => { s.gold += 40; } },
  martial:  { name: "상무의 나라", desc: "징병할 때 군사 +1 · 시작 군사 +5",  apply: s => { s.mil += 5; } },
  scholar:  { name: "학문의 나라", desc: "기술 +2/년 · 시작 기술 +10",       apply: s => { s.tech += 10; } },
};
const BUILDINGS = {
  farm:     { name: "농장", base: 30,  era: 0, desc: "식량 +5/년" },
  market:   { name: "시장", base: 40,  era: 0, desc: "금 +4/년 (시대 배율)" },
  barracks: { name: "병영", base: 45,  era: 0, desc: "징병 +1, 군 유지비 −10%" },
  temple:   { name: "신전", base: 35,  era: 0, desc: "민심 +1/년" },
  school:   { name: "학당", base: 50,  era: 1, desc: "기술 +3/년" },
  wall:     { name: "성벽", base: 60,  era: 2, desc: "방어력 +15%" },
  port:     { name: "항구", base: 80,  era: 3, desc: "금 +8, 식량 +3/년" },
  factory:  { name: "공장", base: 120, era: 4, desc: "금 +10, 기술 +4, 민심 −1/년" },
};
const PERS = {
  hostile:  { name: "호전적", base: -25 },
  neutral:  { name: "중립적", base: 0 },
  peaceful: { name: "온건한", base: 20 },
  merchant: { name: "상업적", base: 10 },
};
const TAX = { low: { name: "감세", m: 0.6, mood: 3 }, normal: { name: "보통", m: 1, mood: 0 }, high: { name: "중세", m: 1.5, mood: -4 } };
const SYL = ["가", "라", "온", "벨", "카", "도", "무", "세", "하", "린", "아", "로", "타", "미", "소", "바", "누", "에", "르", "진", "사", "키"];
const SUF = ["왕국", "제국", "공국", "연맹", "칸국", "부족 연합"];
const TITLES = ["왕", "여왕", "칸", "대공", "황제", "족장"];

/* ───────── 상태 ───────── */
let S = null;
let shownEventKey = null;

function genNeighbors() {
  const used = new Set();
  const ps = ["hostile", "neutral", "peaceful", "merchant", pick(["hostile", "neutral"])];
  return ps.slice(0, 4).map((p, i) => {
    let name;
    do { name = pick(SYL) + pick(SYL) + (Math.random() < 0.4 ? pick(SYL) : ""); } while (used.has(name));
    used.add(name);
    return {
      id: i, name: name + " " + pick(SUF), ruler: pick(SYL) + pick(SYL) + " " + pick(TITLES),
      pers: p, power: r1(rnd(5, 11)), land: ri(4, 7), relation: PERS[p].base + ri(-10, 10),
      status: "peace", warTurns: 0, alive: true,
    };
  });
}

function newGame(nation, ruler, trait) {
  S = {
    nation, ruler, trait, year: 1, era: 0,
    gold: 60, food: 40, pop: 10, mil: 6, mood: 60, tech: 0, land: 5,
    tax: "normal", ap: 3, maxAp: 3,
    b: { farm: 0, market: 0, barracks: 0, temple: 0, school: 0, wall: 0, port: 0, factory: 0 },
    neighbors: genNeighbors(), log: [], event: null, over: null, onceDone: {}, stats: { wins: 0, losses: 0, annexed: 0 },
  };
  TRAITS[trait].apply(S);
  log(`${S.ruler}, ${S.nation}을(를) 세우다. ${ERAS[0].intro}`, "era");
  log(`주변에는 ${S.neighbors.map(n => n.name).join(", ")}이(가) 자리 잡고 있다.`);
  shownEventKey = null;
  save(); render();
}

function log(t, k = "info") { S.log.unshift({ y: S.year, t, k, f: 1 }); if (S.log.length > 300) S.log.length = 300; }
function mood(d) { S.mood = clamp(Math.round(S.mood + d), 0, 100); }
function nb(id) { return S.neighbors.find(n => n.id === id); }
function alive() { return S.neighbors.filter(n => n.alive); }
function eraMult() { return ERAS[S.era].mult; }
function myStr() { return r1(S.mil * eraMult()); }
function allyHelp() { return r1(alive().filter(n => n.status === "ally").reduce((a, n) => a + n.power * 0.3, 0)); }
function bCount() { return Object.values(S.b).reduce((a, c) => a + c, 0); }
function bCost(k) { return Math.round(BUILDINGS[k].base * (1 + 0.6 * S.b[k]) * (1 + S.era * 0.1)); }
function normalize() {
  S.gold = r1(Math.max(0, S.gold)); S.food = r1(Math.max(0, S.food)); S.tech = r1(Math.max(0, S.tech));
  S.mil = Math.max(0, Math.round(S.mil)); S.pop = r1(Math.max(0, S.pop)); S.mood = clamp(Math.round(S.mood), 0, 100);
  S.neighbors.forEach(n => { n.relation = clamp(Math.round(n.relation), -100, 100); n.power = r1(Math.max(1, n.power)); });
}

/* ───────── 경제 ───────── */
function income() {
  const b = S.b, m = eraMult();
  let gold = S.pop * 0.8 * TAX[S.tax].m + (b.market * 4 + b.port * 8 + b.factory * 10) * m;
  if (S.trait === "commerce") gold *= 1.2;
  gold += alive().filter(n => n.status === "ally").length * 3;
  gold -= S.mil * 0.4 * (1 - Math.min(0.5, b.barracks * 0.1)) + bCount() * 0.5;
  const food = 4 + S.land * 1.5 + (b.farm * (5 + (S.trait === "agri" ? 2 : 0)) + b.port * 3) * (1 + S.era * 0.15) - S.pop * 0.8 - S.mil * 0.3;
  const tech = (1 + S.pop * 0.1 + b.school * 3 + b.factory * 4 + (S.trait === "scholar" ? 2 : 0)) * (1 + S.era * 0.1);
  const wars = alive().filter(n => n.status === "war").length;
  const md = TAX[S.tax].mood + b.temple - b.factory - wars * 2 + (S.mood > 70 ? -1 : S.mood < 40 ? 1 : 0);
  return { gold: r1(gold), food: r1(food), tech: r1(tech), mood: md, popCap: S.land * 3 + 5 + S.era * 2 };
}

/* ───────── 행동 ───────── */
const ACTS = {
  develop: { name: "영토 개척", cost: () => ({ gold: 20 + S.land * 3 }), ok: () => S.land < 8 + S.era * 4, why: "개척할 땅이 없습니다. 정복으로 넓히세요.",
    run: () => { S.land++; log(`변경의 황무지를 개척했다. 영토가 ${S.land}이(가) 되었다.`, "good"); } },
  recruit: { name: "징병", cost: () => ({ gold: 12, food: 4 }), ok: () => S.pop >= 2, why: "인구가 너무 적습니다.",
    run: () => { const g = 3 + S.b.barracks + (S.trait === "martial" ? 1 : 0); S.mil += g; S.pop = r1(S.pop - 0.5); log(`장정을 모아 군사 ${g}을(를) 길렀다.`); } },
  research: { name: "학문 장려", cost: () => ({ gold: 15 + S.era * 5 }), ok: () => true,
    run: () => { const g = r1((6 + S.b.school * 2) * (1 + S.era * 0.2)); S.tech += g; log(`학자들을 후원하여 기술 ${g}을(를) 쌓았다.`); } },
  festival: { name: "축제", cost: () => ({ gold: 20 + S.era * 10 }), ok: () => true,
    run: () => { mood(12); log("도성에서 큰 축제를 열었다. 백성들이 왕의 이름을 외쳤다.", "good"); } },
  expo: { name: "만국 박람회", cost: () => ({ gold: 300 }), ok: () => S.era === 5, why: "근대에 들어서야 열 수 있습니다.",
    run: () => { S.over = { win: true, title: "문명의 정점", text: `${S.nation}이(가) 만국 박람회를 열었다. 세계 각국의 사절이 도성에 모여 이 나라의 학문과 산업에 경탄했다. 사관은 이 해를 왕조의 황금기로 기록했다.` }; log("만국 박람회 개최. 세계가 이 나라를 우러러보았다.", "era"); } },
};
function canPay(c) { return (c.gold || 0) <= S.gold && (c.food || 0) <= S.food; }
function costText(c) { return [c.gold ? `금 ${c.gold}` : "", c.food ? `식량 ${c.food}` : ""].filter(Boolean).join(" · "); }
function doAct(k) {
  const a = ACTS[k]; const c = a.cost();
  if (S.over || S.ap < 1) return toast("행동력이 없습니다. 한 해를 마치세요.");
  if (!a.ok()) return toast(a.why);
  if (!canPay(c)) return toast("재물이 부족합니다.");
  S.gold -= c.gold || 0; S.food -= c.food || 0; S.ap--;
  a.run(); after();
}
function build(k) {
  const c = bCost(k);
  if (S.ap < 1 || S.gold < c || BUILDINGS[k].era > S.era) return;
  S.gold -= c; S.ap--; S.b[k]++;
  log(`${BUILDINGS[k].name}을(를) 세웠다. (${BUILDINGS[k].desc})`, "good");
  closeModal(); after();
}
function setTax(t) { if (S.over) return; S.tax = t; save(); render(); }
function advanceEra() {
  if (S.era >= ERAS.length - 1 || S.tech < ERAS[S.era + 1].need) return;
  S.era++; S.maxAp = 3 + Math.floor(S.era / 2); mood(5);
  log(`${ERAS[S.era].name}에 들어서다. ${ERAS[S.era].intro}`, "era");
  toast(`${ERAS[S.era].name}의 막이 올랐다`);
  after();
}

/* 외교 */
const giftCost = () => 20 + S.era * 10;
function dip(kind, id) {
  const n = nb(id); if (!n || !n.alive || S.over) return;
  if (kind === "war") {
    n.status = "war"; n.warTurns = 0; n.relation -= 60;
    alive().forEach(o => { if (o !== n) o.relation -= 8; });
    log(`${n.name}에 선전포고했다. 이웃 나라들이 경계하기 시작했다.`, "war");
    return after();
  }
  if (S.ap < 1) return toast("행동력이 없습니다.");
  if (kind === "gift") {
    if (S.gold < giftCost()) return toast("금이 부족합니다.");
    S.gold -= giftCost(); S.ap--; const g = n.pers === "merchant" ? 25 : n.pers === "hostile" ? 10 : 15;
    n.relation += g; log(`${n.name}에 예물을 보냈다. 관계 +${g}.`);
  } else if (kind === "ally") {
    if (n.relation < 60 || n.status !== "peace") return;
    S.ap--; n.status = "ally"; n.relation += 5;
    log(`${n.name}와(과) 동맹을 맺었다. 교역로가 열리고 유사시 원군을 보낸다.`, "good");
  } else if (kind === "attack") {
    if (n.status !== "war") return;
    S.ap--; attack(n);
  } else if (kind === "peace") {
    if (n.status !== "war") return;
    S.ap--;
    const ch = 0.25 + (myStr() > n.power ? 0.35 : 0) + (n.warTurns > 3 ? 0.15 : 0);
    if (Math.random() < ch) { n.status = "peace"; n.relation = Math.max(n.relation, -15); n.warTurns = 0; log(`${n.name}와(과) 화친을 맺었다. 국경에 다시 평화가 찾아왔다.`, "good"); }
    else log(`${n.name}이(가) 화친 제의를 거절했다.`, "bad");
  }
  after();
}
function attack(n) {
  const me = myStr() * rnd(0.75, 1.25), them = n.power * rnd(0.75, 1.25) * 1.1;
  if (me > them) {
    const take = Math.min(n.land, me > them * 1.6 ? 2 : 1);
    const loss = Math.ceil(S.mil * 0.15), loot = Math.round(10 + take * 8 * (1 + S.era * 0.3));
    n.land -= take; S.land += take; n.power *= 0.7; S.mil -= loss; S.gold += loot; S.pop += take * 0.8;
    S.stats.wins++;
    log(`${n.name}을(를) 쳐서 이겼다. 땅 ${take}을(를) 빼앗고 금 ${loot}을(를) 거두었다. (아군 손실 ${loss})`, "war");
    if (n.land <= 0) {
      n.alive = false; n.status = "dead"; S.stats.annexed++; mood(5); S.pop += 2;
      log(`${n.name}의 ${n.ruler}이(가) 항복했다. 그 땅과 백성이 모두 ${S.nation}에 편입되었다.`, "era");
    }
  } else {
    const loss = Math.ceil(S.mil * 0.3);
    S.mil -= loss; mood(-5); n.power *= 0.92; S.stats.losses++;
    log(`${n.name} 원정이 실패했다. 군사 ${loss}을(를) 잃고 패잔병이 돌아왔다.`, "bad");
  }
}
function defend(n) {
  const me = (myStr() + allyHelp()) * (1 + S.b.wall * 0.15) * rnd(0.75, 1.25), them = n.power * rnd(0.75, 1.25);
  if (me >= them) {
    n.power *= 0.8; S.mil -= Math.ceil(S.mil * 0.1); mood(3);
    log(`${n.name}의 침공을 막아냈다.${allyHelp() ? " 동맹군이 함께 싸웠다." : ""}`, "good");
  } else {
    S.land--; n.land++; S.pop = r1(Math.max(0.5, S.pop - 1)); S.mil -= Math.ceil(S.mil * 0.25); mood(-6);
    const lost = Math.round(S.gold * 0.15); S.gold -= lost; n.power *= 0.9;
    log(`${n.name}에 국경이 뚫렸다. 땅 1과 금 ${lost}을(를) 빼앗겼다.`, "war");
  }
}

/* ───────── 한 해의 흐름 ───────── */
function endTurn() {
  if (!S || S.over || S.event) return;
  const inc = income();
  S.gold += inc.gold; S.food += inc.food; S.tech += inc.tech; mood(inc.mood);
  if (S.gold < 0) { S.gold = 0; const d = Math.ceil(S.mil * 0.15); S.mil -= d; mood(-5); log(`국고가 바닥나 병사 ${d}이(가) 탈영했다.`, "bad"); }
  if (S.food < 0) { S.food = 0; S.pop = r1(S.pop * 0.92); mood(-10); log("흉년으로 곡식이 떨어졌다. 굶주린 백성이 늘어난다.", "bad"); }
  else if (inc.food > 0 && S.pop < inc.popCap) S.pop = r1(Math.min(inc.popCap, S.pop + Math.max(0.2, S.pop * 0.04 + inc.food * 0.02)));
  else if (S.pop > inc.popCap) S.pop = r1(S.pop - (S.pop - inc.popCap) * 0.3);
  if (S.mood < 20 && Math.random() < 0.35) { const g = Math.round(S.gold * 0.1); S.gold -= g; log(`각지에서 민란이 일어났다. 관아가 불타 금 ${g}을(를) 잃었다.`, "bad"); }

  for (const n of alive()) {
    n.power += rnd(0.3, 0.9) * (1 + S.era * 0.3 + S.year / 150);
    if (Math.random() < 0.06) n.land++;
    const base = PERS[n.pers].base;
    n.relation += n.relation < base ? 1 : n.relation > base ? -1 : 0;
    if (n.status === "ally" && n.relation < 20) { n.status = "peace"; log(`${n.name}와(과)의 동맹이 깨졌다.`, "bad"); }
    if (n.status === "peace") {
      const stronger = n.power > myStr() * 1.2;
      if ((n.relation < -30 && Math.random() < 0.15 + (stronger ? 0.15 : 0)) || (n.pers === "hostile" && stronger && n.relation < 0 && Math.random() < 0.06)) {
        n.status = "war"; n.warTurns = 0; n.relation = Math.min(n.relation, -40);
        log(`${n.name}의 ${n.ruler}이(가) 선전포고했다!`, "war");
      }
    } else if (n.status === "war") {
      n.warTurns++;
      if (Math.random() < 0.45) defend(n);
      else if (!S.event && n.warTurns > 3 && n.power < myStr() && Math.random() < 0.3) S.event = { id: "peaceOffer", p: n.id };
    }
  }
  S.year++; S.maxAp = 3 + Math.floor(S.era / 2); S.ap = S.maxAp;
  normalize(); checkEnd();
  if (!S.over && !S.event && Math.random() < 0.55) rollEvent();
  if (!S.over && S.era < ERAS.length - 1 && S.tech >= ERAS[S.era + 1].need) toast(`${ERAS[S.era + 1].name}로 나아갈 준비가 되었습니다`);
  save(); render();
}
function after() { normalize(); checkEnd(); save(); render(); }
function checkEnd() {
  if (S.over) return;
  if (S.land <= 0) S.over = { win: false, title: "왕조의 몰락", text: `마지막 성이 함락되었다. ${S.ruler}은(는) 포로가 되었고 ${S.nation}의 이름은 이웃 나라의 연대기에 한 줄로만 남았다.` };
  else if (S.mood <= 0) S.over = { win: false, title: "민중의 봉기", text: `분노한 백성이 궁궐 문을 부수었다. ${S.ruler}은(는) 쫓겨나고 새 세력이 나라를 차지했다.` };
  else if (S.pop < 1) S.over = { win: false, title: "텅 빈 나라", text: "굶주림과 전쟁으로 백성이 모두 흩어졌다. 왕관을 받쳐 줄 사람이 남지 않았다." };
  else if (alive().length === 0) S.over = { win: true, title: "천하 통일", text: `모든 이웃 나라가 ${S.nation}의 깃발 아래 하나가 되었다. ${S.ruler}의 이름은 통일 군주로 기록되었다.` };
  if (S.over) log(S.over.title + ". " + S.over.text, S.over.win ? "era" : "war");
}

/* ───────── 사건 ───────── */
const randNb = () => { const a = alive().filter(n => n.status !== "war"); return a.length ? pick(a).id : null; };
const EVENTS = {
  harvest: { make: () => ({ t: "풍년", d: `올해 ${S.nation}의 들판이 황금빛으로 물들었다. 창고가 넘칠 지경이다.`, c: [
    { l: "곡식을 비축한다", h: "식량 +25", f: () => { S.food += 25; return "곡창이 가득 찼다."; } },
    { l: "추수 잔치를 연다", h: "식량 +10 · 민심 +8", f: () => { S.food += 10; mood(8); return "백성들이 밤새 노래했다."; } } ] }) },
  plague: { make: () => ({ t: "역병", d: "남쪽 마을에서 열병이 번지고 있다. 의원들은 손을 쓸 수 없다고 고한다.", c: [
    { l: "마을을 봉쇄하고 의원을 보낸다", h: "금 −25 · 인구 −0.5", r: () => S.gold >= 25, f: () => { S.gold -= 25; S.pop -= 0.5; return "봉쇄 덕분에 병이 더 퍼지지 않았다."; } },
    { l: "하늘에 제사를 올린다", h: "인구 −1 · 민심 +2", f: () => { S.pop -= 1; mood(2); return "제사 뒤에 병이 잦아들었지만 희생이 컸다."; } },
    { l: "그대로 둔다", h: "인구 −2 · 민심 −8", f: () => { S.pop -= 2; mood(-8); return "역병이 온 나라를 휩쓸었다."; } } ] }) },
  scholar: { make: () => ({ t: "떠돌이 학자", d: "먼 나라에서 온 학자가 궁 앞에서 벼슬을 청한다. 별의 운행과 수의 이치를 안다고 한다.", c: [
    { l: "높은 녹봉으로 등용한다", h: "금 −25 · 기술 +15", r: () => S.gold >= 25, f: () => { S.gold -= 25; S.tech += 15; return "학자가 새 역법을 바쳤다."; } },
    { l: "돌려보낸다", h: "변화 없음", f: () => "학자는 이웃 나라로 떠났다." } ] }) },
  caravan: { make: () => ({ t: "대상단", d: "비단과 향신료를 실은 대상단이 국경에 도착했다.", c: [
    { l: "자유롭게 교역하게 한다", h: "금 +30 · 민심 +2", f: () => { S.gold += 30; mood(2); return "장터가 북적였다."; } },
    { l: "무거운 관세를 매긴다", h: "금 +50 · 이웃 관계 −5", f: () => { S.gold += 50; alive().forEach(n => n.relation -= 5); return "국고는 찼지만 상인들 사이에 원성이 퍼졌다."; } } ] }) },
  nobles: { make: () => ({ t: "귀족의 반발", d: "지방 귀족들이 왕권 강화에 반대하며 연판장을 올렸다.", c: [
    { l: "특권을 일부 돌려준다", h: "금 −20 · 민심 +5", r: () => S.gold >= 20, f: () => { S.gold -= 20; mood(5); return "귀족들이 물러났다."; } },
    { l: "주동자를 처벌한다", h: "군사 −2 · 민심 −6 · 금 +15", f: () => { S.mil -= 2; mood(-6); S.gold += 15; return "몰수한 재산이 국고로 들어왔지만 민심이 흉흉하다."; } } ] }) },
  locust: { make: () => ({ t: "메뚜기 떼", d: "하늘을 뒤덮은 메뚜기 떼가 곡창 지대로 내려앉았다.", c: [
    { l: "관군을 풀어 불을 놓는다", h: "금 −20 · 식량 −10%", r: () => S.gold >= 20, f: () => { S.gold -= 20; S.food *= 0.9; return "피해를 줄였다."; } },
    { l: "어쩔 수 없다", h: "식량 −30%", f: () => { S.food *= 0.7; return "들판이 앙상하게 남았다."; } } ] }) },

function rollEvent() {
  const pool = [];
  for (const [id, e] of Object.entries(EVENTS)) {
    if (e.special || (e.era || 0) > S.era || (e.cond && !e.cond()) || (e.once && S.onceDone[id])) continue;
    for (let i = 0; i < (e.w || 1); i++) pool.push(id);
  }
  const id = pick(pool); const e = EVENTS[id];
  const p = e.p ? e.p() : null;
  if (e.p && p === null) return;
  S.event = { id, p };
}
function chooseEvent(i) {
  const e = EVENTS[S.event.id]; const ev = e.make(S.event.p); const c = ev.c[i];
  if (!c || (c.r && !c.r())) return;
  const res = c.f();
  if (e.once) S.onceDone[S.event.id] = 1;
  log(`[${ev.t}] ${c.l}. ${res}`, "info");
  S.event = null; shownEventKey = null;
  normalize(); checkEnd(); save();
  openModal(`<div class="eyebrow">건국 ${S.year}년 · ${esc(ev.t)}</div><h3>${esc(c.l)}</h3><p>${esc(res)}</p><div class="row"><button class="btn-primary" data-m="close" type="button">계속</button></div>`);
  render(true);
}

/* ───────── 저장 ───────── */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ───────── 화면 ───────── */
function openModal(html) { $("#modal").innerHTML = html; $("#scrim").hidden = false; const f = $("#modal").querySelector("button:not([disabled]), input"); if (f) f.focus({ preventScroll: true }); }

let toastT;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2400); }

function render(keepModal) {
  if (!S) return;

    ["식량", S.food, `<span class="d ${dCls(inc.food)}">${sgn(inc.food)}/년</span>`, inc.food < 0 && S.food + inc.food < 0],

  const o = S.over;
  openModal(`<div class="eyebrow">${o.win ? "승리" : "패배"} · 건국 ${S.year}년 · ${ERAS[S.era].name}</div><h3>${esc(o.title)}</h3><p>${esc(o.text)}</p>
    <div class="statgrid"><div>통치 기간<b>${S.year}년</b></div><div>최종 영토<b>${S.land}</b></div><div>인구<b>${S.pop}만</b></div><div>전투 승리<b>${S.stats.wins}</b></div><div>합병한 나라<b>${S.stats.annexed}</b></div><div>기술<b>${S.tech}</b></div></div>
    <div class="row"><button class="btn-ghost" data-m="close" type="button">연대기 보기</button><button class="btn-primary" data-m="setup" type="button">새 왕조를 연다</button></div>`);
}
let setupTrait = "agri";
function showSetup() {
  const hasSave = S && !S.over;
  openModal(`<div class="eyebrow">새 왕조</div><h3>나라를 세운다</h3>
    <p>작은 부족에서 시작해 여섯 시대를 거치며 나라를 키운다. 이웃 나라를 모두 합병하거나, 근대에 이르러 만국 박람회를 열면 승리한다.</p>
    <div class="field"><label for="in-nation">나라 이름</label><input id="in-nation" maxlength="14" value="새벽 왕국"></div>
    <div class="field"><label for="in-ruler">군주 이름</label><input id="in-ruler" maxlength="14" value="태조 한빛"></div>
    <div class="field"><label>나라의 기풍</label><div class="traits">${Object.entries(TRAITS).map(([k, t]) => `<button type="button" class="trait ${k === setupTrait ? "on" : ""}" data-trait="${k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join("")}</div></div>
    <div class="row">${hasSave ? `<button class="btn-ghost" data-m="close" type="button">이어서 하기</button>` : ""}<button class="btn-primary" data-m="start" type="button">건국한다</button></div>`);
}
function showHelp() {
  openModal(`<div class="eyebrow">규칙</div><h3>왕조를 다스리는 법</h3><div class="help">
    <h4>한 해의 흐름</h4><ul><li>해마다 행동력(시대가 오를수록 늘어남)만큼 국정·외교 명령을 내린다.</li><li>‘한 해를 마친다’를 누르면 세금·수확·연구가 정산되고 이웃 나라가 움직이며 사건이 일어난다.</li></ul>
    <h4>국력</h4><ul><li>식량이 모자라면 기근, 금이 모자라면 탈영이 일어난다.</li><li>인구는 영토에 비례한 상한까지 늘어난다. 영토는 개척하거나 정복해서 넓힌다.</li><li>민심이 0이 되면 봉기로 왕조가 무너진다. 세율과 신전, 축제로 다스린다.</li></ul>
    <h4>시대</h4><ul><li>기술이 쌓이면 다음 시대로 나아간다. 시대마다 군사력과 시설 효율이 커지고 새 건물이 열린다.</li></ul>
    <h4>외교와 전쟁</h4><ul><li>예물로 관계를 높이고, 관계 60 이상이면 동맹을 맺는다. 동맹국은 교역 수입을 주고 방어전에 원군을 보낸다.</li><li>관계가 −30 아래로 떨어지면 이웃이 쳐들어올 수 있다. 성벽이 방어를 돕는다.</li></ul>
    <h4>승리와 패배</h4><ul><li>승리: 모든 이웃 합병(천하 통일) 또는 근대에 만국 박람회 개최(문명의 정점).</li><li>패배: 영토 상실, 민중 봉기, 인구 소멸.</li></ul>
    </div><div class="row"><button class="btn-primary" data-m="close" type="button">닫기</button></div>`);
}
function showBuild() {
  if (S.over || S.ap < 1) return;
  openModal(`<div class="eyebrow">건설 · 행동력 1</div><h3>무엇을 세울까</h3><div class="choices">${Object.entries(BUILDINGS).map(([k, b]) => {
    const locked = b.era > S.era, c = bCost(k), ok = !locked && S.gold >= c;
    return `<button class="choice" data-b="${k}" type="button" ${ok ? "" : "disabled"}><b>${b.name} <span class="num">(${S.b[k]})</span></b><span>${locked ? ERAS[b.era].name + "에 열림" : `금 ${c} · ${b.desc}`}</span></button>`;
  }).join("")}</div><div class="row"><button class="btn-ghost" data-m="close" type="button">그만둔다</button></div>`);
}

/* ───────── 입력 ───────── */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.a === "build") return showBuild();
  if (d.a === "era") return advanceEra();
  if (d.a) return doAct(d.a);
  if (d.tax) return setTax(d.tax);
  if (d.d) return dip(d.d, +d.id);
  if (d.b) return build(d.b);
  if (d.ev !== undefined) return chooseEvent(+d.ev);
  if (d.trait) { setupTrait = d.trait; document.querySelectorAll(".trait").forEach(b => b.classList.toggle("on", b.dataset.trait === setupTrait)); return; }
  if (d.m === "close") { closeModal(); return; }
  if (d.m === "setup") return showSetup();
  if (d.m === "start") {
    const nation = ($("#in-nation").value || "").trim() || "새벽 왕국", ruler = ($("#in-ruler").value || "").trim() || "태조 한빛";
    closeModal(); newGame(nation, ruler, setupTrait); return;
  }
  if (t.id === "btn-end") return endTurn();
  if (t.id === "btn-new") return showSetup();
  if (t.id === "btn-help") return showHelp();
});
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim" && S && !S.event && !S.over && $("#modal").querySelector("[data-m=close]")) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#scrim").hidden && $("#modal").querySelector("[data-m=close]") && !(S && S.event)) closeModal();
});

/* ───────── 시작 ───────── */
function start(data) {
  const saved = (data && data.S) || load();
  if (saved && saved.nation) { S = saved; render(); if (!S.event && !S.over) {} }
  else {
    newGame("새벽 왕국", "태조 한빛", "agri");
    showSetup();
  }
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
<!-- END-CONTENT -->
</html>
