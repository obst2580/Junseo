[project]
name = "studio-app"
version = "0.1.0"
description = "studio 화면: 편성·대본·자료·프리미어 XML·업로드 기록을 브라우저에서"
requires-python = ">=3.11"
dependencies = [
    "studio-core",
    "topicradar",
    "newsclip",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
studio = "studio_app.cli:main"

[tool.uv.sources]
studio-core = { workspace = true }
topicradar = { workspace = true }
newsclip = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_app"]
