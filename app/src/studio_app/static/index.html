<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f5f5f2; --surface: #ffffff; --surface-2: #f0efeb; --ink: #1c1c1e; --ink-2: #48484d; --muted: #75757b;
  --line: #e3e2dd; --accent: #2f5bd3; --accent-ink: #ffffff; --accent-soft: #e8eefc;
  --ok: #1f7a4d; --ok-soft: #e3f3ea; --warn: #a2561a; --warn-soft: #fbefe2; --bad: #b3261e; --bad-soft: #fbe7e5;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214; --surface: #1b1b1e; --surface-2: #232327; --ink: #ececee; --ink-2: #c4c4c9; --muted: #95959c;
    --line: #2e2e33; --accent: #7c9cff; --accent-ink: #0d1530; --accent-soft: #1f2744;
    --ok: #5fcf95; --ok-soft: #173326; --warn: #f0a868; --warn-soft: #36261a; --bad: #ff8a80; --bad-soft: #3a1d1b;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상단 */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1160px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
.brand { font-weight: 800; letter-spacing: -.02em; font-size: 18px; color: var(--ink); }
.brand:hover { text-decoration: none; }
nav { display: flex; gap: 4px; flex: 1; }
nav a { padding: 7px 12px; border-radius: 999px; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
nav a:hover { background: var(--surface-2); text-decoration: none; }
nav a.on { background: var(--ink); color: var(--surface); }
.mode { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.mode.claude { background: var(--ok-soft); color: var(--ok); }
.mode.offline { background: var(--warn-soft); color: var(--warn); }
.mode.rejected { background: var(--bad-soft); color: var(--bad); }

main { max-width: 1160px; margin: 0 auto; padding: 24px 20px 120px; }
@media (max-width: 640px) {
  .top-in { gap: 8px; padding: 10px 16px; } nav a { padding: 6px 9px; } .mode { display: none; }
  main { padding: 18px 16px 120px; } h1 { font-size: 23px; } .card { padding: 16px; }
}
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 6px 0 20px; flex-wrap: wrap; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.02em; margin: 2px 0 0; }
h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 16px 0 6px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grid { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card + .card { margin-top: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.big { padding: 12px 18px; font-size: 15px; border-radius: 12px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* 입력 */
input[type=text], input[type=password], input[type=date], input[type=number], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; }
label.field { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
label.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }

/* 알림 박스 */
.note { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.note.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.note.ok { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.note.info { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.note ul { margin: 6px 0 0; padding-left: 20px; }
.note b.t { display: block; margin-bottom: 2px; }

/* 홈: 슬롯 타일 */
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.slot { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; background: var(--surface); position: relative; }
.slot.suggest { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.slot .name { font-size: 17px; font-weight: 800; }
.slot .desc { color: var(--muted); font-size: 13px; min-height: 38px; }
.slot .tag { position: absolute; top: 12px; right: 12px; font-size: 11.5px; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 999px; }
@media (max-width: 760px) { .slots { grid-template-columns: 1fr; } }

/* 프로젝트 목록 */
.plist { display: grid; }
.pitem { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
.pitem:first-child { border-top: 0; }
.pitem .t { font-weight: 700; }
.pitem .s { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; }
.dots { display: flex; gap: 4px; }
.dot { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dot.on { background: var(--ok); }
.next { font-size: 13px; color: var(--ink-2); }
@media (max-width: 760px) { .pitem { grid-template-columns: 1fr; } }

/* 단계 표시 */
.stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 0 0 18px; position: sticky; top: 57px; z-index: 10; background: var(--bg); padding: 8px 0; }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; cursor: pointer; text-align: left; }
.step .n { font-size: 12px; font-weight: 700; color: var(--muted); }
.step .l { font-weight: 700; font-size: 14px; }
.step.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.step.done .n { color: var(--ok); }
.step.cur { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
@media (max-width: 860px) { .stepper { grid-template-columns: repeat(3, 1fr); position: static; } }

.sec { scroll-margin-top: 140px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.sec-h .num { font-weight: 800; color: var(--accent); }

/* 편성 표 */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
table.plan { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
table.plan th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.plan td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plan tr.detail td { background: var(--surface-2); font-size: 13px; }
.role { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.role.헤드라인, .role.줄기 { background: var(--accent); color: var(--accent-ink); }
.role.오늘의포인트, .role.포인트회수 { background: var(--accent-soft); color: var(--accent); }
.cat { font-size: 12px; color: var(--muted); margin-left: 6px; }
.tname { font-weight: 700; }
.links a { font-size: 12.5px; margin-right: 8px; }
.score { font-weight: 800; font-size: 16px; }
.hit { font-weight: 700; }
.hit.hit_ { color: var(--ok); } .hit.miss { color: var(--bad); } .hit.pending { color: var(--muted); }
.buzz { font-size: 13px; color: var(--ink-2); }
.reasons { display: grid; grid-template-columns: 70px 40px 1fr; gap: 2px 10px; }
.weights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 760px) { .weights { grid-template-columns: 1fr 1fr; } }
@media (max-width: 860px) { table.plan .hide-s { display: none; } }

/* 대본 */
textarea.script { font-size: 16px; line-height: 1.75; min-height: 520px; padding: 12px 14px; }
.meter { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.meter b { color: var(--ink); }
.meter .bad { color: var(--bad); }

/* 업로드 */
.drops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; cursor: pointer; display: grid; gap: 6px; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop.done { border-style: solid; border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.drop .big { font-weight: 800; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
@media (max-width: 760px) { .drops { grid-template-columns: 1fr; } }
ol.steps { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
ol.steps li { margin: 3px 0; }

/* 장면 */
.scenes { display: grid; gap: 12px; margin-top: 14px; }
.scene { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
.scene.skipped { opacity: .5; }
.scene .meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.scene .meta b { color: var(--ink); }
.scene .text { margin: 6px 0 10px; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cand { border: 2px solid transparent; border-radius: 10px; padding: 6px; background: var(--surface-2); cursor: pointer; }
.cand.chosen { border-color: var(--accent); }
.cand img, .cand video { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--line); display: block; }
.cand video { background: #000; }
.cand .src { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
.cand .sc { font-size: 12px; font-weight: 600; margin-top: 4px; }
.cand .clip { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; }
.cand .clip input { width: 72px; padding: 3px 6px; }

/* 설정 */
.keyrow { display: grid; grid-template-columns: 220px 1fr 260px; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.keyrow:first-of-type { border-top: 0; }
.keyrow .k { font-weight: 700; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.no { background: var(--bad-soft); color: var(--bad); }
.badge.opt { background: var(--surface-2); color: var(--muted); }
@media (max-width: 860px) { .keyrow { grid-template-columns: 1fr; } }
.tones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tone { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
.tone.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tone pre { white-space: pre-wrap; font-family: inherit; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); margin: 6px 0 0; max-height: 160px; overflow: auto; }
@media (max-width: 860px) { .tones { grid-template-columns: 1fr; } }
.comm { display: grid; grid-template-columns: auto 140px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.comm .u { font-size: 12.5px; color: var(--muted); word-break: break-all; }
@media (max-width: 760px) { .comm { grid-template-columns: auto 1fr; } }
.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { transform: translateX(18px); }
textarea.code { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; min-height: 380px; }

/* 성과(마크다운) */
.md h2 { margin-top: 18px; } .md h3 { margin-top: 14px; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 14px; width: 100%; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.md code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }

/* 작업 표시 */
.job { position: fixed; right: 18px; bottom: 18px; z-index: 50; width: min(420px, calc(100vw - 36px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.15); padding: 12px 14px; display: none; }
.job.show { display: block; }
.job .jh { display: flex; align-items: center; gap: 10px; }
.job .jl { font-weight: 700; flex: 1; }
.job .last { font-size: 13px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job pre { max-height: 220px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); padding: 8px; border-radius: 8px; white-space: pre-wrap; margin: 8px 0 0; }
.job.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.job.error { border-color: var(--bad); }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 토스트·모달 */
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
.toast.bad { background: var(--bad); color: #fff; }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.show { display: flex; }
.modal .box { background: var(--surface); border-radius: 16px; width: min(760px, 100%); max-height: 85vh; overflow: auto; padding: 20px; }
.cand-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">studio</a>
    <nav id="nav">
      <a href="#/" data-r="">오늘</a>
      <a href="#/projects" data-r="projects">프로젝트</a>
      <a href="#/history" data-r="history">성과</a>
      <a href="#/settings" data-r="settings">설정</a>
    </nav>
    <span id="mode" class="mode"></span>
  </div>
</header>
<main id="app"><div class="loading">불러오는 중…</div></main>

<div class="job" id="job">
  <div class="jh"><span class="spin" id="job-spin"></span><span class="jl" id="job-label"></span><span class="small muted" id="job-time"></span>
    <button class="btn ghost small" id="job-toggle">로그</button><button class="btn ghost small" id="job-close" title="닫기">✕</button></div>
  <div class="last" id="job-last"></div>
  <pre id="job-log" hidden></pre>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const SLOT = { morning: '아침 프리뷰', evening: '저녁 리뷰', weekly: '주간 심층' };
const SLOT_DESC = {
  morning: '어젯밤 17시~오늘 5:30 소식으로 "오늘 볼 것"을 예고. 7시 업로드용.',
  evening: '오늘 5:30~17:00 결과 정리 + 아침 예상 회수. 19시 업로드용.',
  weekly: '한 주의 흐름을 인과 사슬로. 일요일 업로드용.',
};
const TARGET = { morning: [900, 1100], evening: [1500, 1800], weekly: [2500, 3000] };
const STEPS = [['plan', '편성·대본'], ['audio', '녹음·자막'], ['assets', '자료'], ['xml', '프리미어'], ['upload', '업로드']];
const NEXT = { plan: '편성 만들기', audio: '녹음 후 자막(SRT) 올리기', assets: '자료 수집', xml: 'XML 만들기', upload: '업로드 기록' };
let STATUS = null;

async function api(path, opts = {}) {
  const init = { method: opts.method || (opts.body !== undefined ? 'POST' : 'GET'), headers: { 'X-Studio': '1' } };
  if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.detail || `${res.status} ${res.statusText}`);
  return data;
}
function toast(msg, bad = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast'; }, bad ? 5000 : 2200);
}
const fail = e => toast(e.message || String(e), true);
function modal(html) { $('#modal-box').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- 작업(백그라운드) ---------- */
const jobDone = {}; const handled = new Set(); let jobTimer = null;
async function runJob(path, body, onDone) {
  try {
    const job = await api(path, { body: body ?? {} });
    if (onDone) jobDone[job.id] = onDone;
    if (job.status !== 'running') finishJob(job); else watchJob();
    return job;
  } catch (e) { fail(e); }
}
function watchJob() { if (!jobTimer) { jobTimer = setInterval(pollJob, 1000); pollJob(); } }
async function pollJob() {
  let job;
  try { ({ job } = await api('/api/jobs/current')); } catch { return; }
  renderJob(job);
  if (!job || job.status !== 'running') { clearInterval(jobTimer); jobTimer = null; if (job) finishJob(job); }
}
function finishJob(job) {
  renderJob(job);
  clearTimeout(finishJob._t);
  if (job.status === 'done') finishJob._t = setTimeout(() => { if (!jobTimer) $('#job').classList.remove('show'); }, 8000);
  if (handled.has(job.id)) return;
  handled.add(job.id);
  if (job.status === 'done') toast(`${job.label} 완료`); else toast(`${job.label} 실패: ${job.error}`, true);
  const cb = jobDone[job.id];
  if (cb) cb(job); else if (job.status === 'done') route();
}
function renderJob(job) {
  const box = $('#job');
  if (!job) { box.classList.remove('show'); return; }
  box.classList.add('show');
  box.classList.toggle('done', job.status === 'done'); box.classList.toggle('error', job.status === 'error');
  $('#job-spin').style.display = job.status === 'running' ? '' : 'none';
  $('#job-label').textContent = (job.status === 'running' ? '' : job.status === 'done' ? '✓ ' : '✕ ') + job.label;
  const m = Math.floor(job.elapsed / 60), s = job.elapsed % 60;
  $('#job-time').textContent = m ? `${m}분 ${s}초` : `${s}초`;
  $('#job-last').textContent = job.error || job.log[job.log.length - 1] || '';
  $('#job-log').textContent = job.log.join('\n');
}
$('#job-toggle').onclick = () => { const p = $('#job-log'); p.hidden = !p.hidden; };

async function route() {

function nextStep(steps) { if (steps.upload) return '업로드 완료'; const k = STEPS.find(([k]) => !steps[k]); return k ? '다음: ' + NEXT[k[0]] : '완료'; }
function projectRows(list) {

function autoCard(auto) {

}
function planSection(pid, d) {
  const plan = d.plan;
  const third = d.summary.slot === 'evening' ? '아침 예상 → 결과' : d.summary.slot === 'morning' ? '예상 / 달라지는 것' : '사슬';
  const rows = d.items.map(it => {
    const t = it.topic;

    const third = it.role === '포인트회수' ? `${hit}<div class="small">${esc(it.actual || '')}</div><div class="small muted">아침: ${esc(it.expected || '')}</div>`

    <div class="small muted" style="margin-bottom:6px">제목 후보</div>
    <div class="chips">${plan.titles.map(x => `<span class="chip" data-copy="${esc(x)}">${esc(x)}</span>`).join('')}
      ${plan.thumbnail_text ? `<span class="chip" data-copy="${esc(plan.thumbnail_text)}" title="썸네일 문구">🖼 ${esc(plan.thumbnail_text)}</span>` : ''}</div>
    <div style="overflow-x:auto"><table class="plan"><thead><tr><th>#</th><th>역할</th><th>주제</th><th>점수</th><th class="hide-s">커뮤니티 반응</th><th class="hide-s">${third}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>

      <ul class="small">${plan.risks.map(r => `<li>[${esc(r.kind)}] ${esc(r.message)}</li>`).join('')}${plan.excluded.map(x => `<li class="muted">${esc(x)}</li>`).join('')}</ul></details>` : ''}`;

function bindPlan(pid, d) {

function scriptSection(p, d) {
  const w = d.warnings;
  return `
    <div class="sec-h"><span class="num">2</span><h2>대본</h2></div>
    <p class="sub">고친 뒤 <b>저장</b>하면 다시 점검합니다. <code>#출처:</code> 줄은 녹음 때 읽지 않고, <code>#TODO</code>·<code>#확인</code>은 처리한 뒤 지우세요.</p>
    <div id="warn-box">${warnBox(w)}</div>
    <textarea class="script" id="script" spellcheck="false">${esc(d.script)}</textarea>
    <div class="row" style="margin-top:10px"><div class="meter" id="meter"></div><span class="spacer"></span>
      <button class="btn" id="rewrite" title="편성은 그대로, 대본만 새로 씁니다(지금 고친 내용은 사라짐)">대본 다시 쓰기</button>
      <button class="btn primary" id="save-script">저장</button></div>`;
}
function warnBox(w) {
  return w.length ? `<div class="note warn" style="margin-bottom:12px"><b class="t">점검 ${w.length}건</b><ul>${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`
    : `<div class="note ok" style="margin-bottom:12px">점검 통과</div>`;
}
function bindScript(pid, p, d) {
  const ta = $('#script'), meter = $('#meter'), [lo, hi] = TARGET[p.slot];
  const update = () => {
    const spoken = ta.value.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
    const chars = spoken.reduce((n, l) => n + [...l.trim()].length, 0);
    const long = spoken.filter(l => [...l.trim()].length > 25).length;
    const todo = (ta.value.match(/#(TODO|확인)/g) || []).length;
    meter.innerHTML = `<span>글자 <b class="${chars < lo || chars > hi ? 'bad' : ''}">${chars.toLocaleString()}</b> / 목표 ${lo.toLocaleString()}~${hi.toLocaleString()}</span>
      <span>읽는 줄 <b>${spoken.length}</b></span><span>25자 넘는 줄 <b class="${long ? 'bad' : ''}">${long}</b></span><span>확인 주석 <b class="${todo ? 'bad' : ''}">${todo}</b></span>`;
  };
  ta.addEventListener('input', update); update();
  $('#save-script').onclick = async () => {
    try { const r = await api(`/api/projects/${pid}/script`, { method: 'PUT', body: { text: ta.value } }); $('#warn-box').innerHTML = warnBox(r.warnings); toast('대본 저장'); }
    catch (e) { fail(e); }
  };
  $('#rewrite').onclick = () => {
    if (!confirm('편성은 그대로 두고 대본을 새로 씁니다. 지금 고친 내용은 사라집니다. 계속할까요?')) return;
    runJob(`/api/projects/${pid}/rewrite`, {}, () => route());
  };
}

function audioSection(p) {
  return `
    <div class="sec-h"><span class="num">3</span><h2>녹음·자막</h2></div>
    <ol class="steps">
      <li>대본을 보고 녹음합니다(<code>#</code>으로 시작하는 줄은 읽지 않음).</li>
      <li>프리미어에 녹음 파일을 놓고 <b>텍스트 패널 → 전사(Transcribe) → 캡션 만들기</b>.</li>
      <li>캡션 트랙 메뉴(…) → <b>SRT 파일 내보내기</b> → 아래에 끌어다 놓기.</li>
    </ol>
    <div class="drops">
      <label class="drop ${p.steps.audio ? 'done' : ''}" data-up="narration.srt"><input type="file" accept=".srt" hidden>
        <span class="big">${p.steps.audio ? '✓ 자막(SRT) 올림' : '자막 SRT 올리기'}</span><span class="small muted">필수 · 장면 나누기와 타이밍 기준</span><div class="bar" hidden><i></i></div></label>
      <label class="drop ${p.has_wav ? 'done' : ''}" data-up="narration.wav"><input type="file" accept=".wav,audio/wav" hidden>
        <span class="big">${p.has_wav ? '✓ 녹음(WAV) 올림' : '녹음 WAV 올리기'}</span><span class="small muted">선택 · 올리면 XML의 내레이션 트랙에 들어감</span><div class="bar" hidden><i></i></div></label>
    </div>`;
}
function uploadFile(pid, name, file, bar) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', `/api/projects/${pid}/upload/${name}`);
    x.setRequestHeader('X-Studio', '1');
    x.upload.onprogress = e => { if (e.lengthComputable) { bar.hidden = false; bar.firstElementChild.style.width = (100 * e.loaded / e.total) + '%'; } };
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {} x.status < 300 ? resolve(d) : reject(new Error(d.error || x.statusText)); };
    x.onerror = () => reject(new Error('업로드 실패'));
    x.send(file);
  });
}
function bindAudio(pid) {
  $$('[data-up]').forEach(z => {
    const inp = $('input', z), name = z.dataset.up, bar = $('.bar', z);
    const go = async f => {
      if (!f) return;
      try { await uploadFile(pid, name, f, bar); toast(`${name} 올림`); route(); } catch (e) { fail(e); bar.hidden = true; }
    };
    inp.onchange = () => go(inp.files[0]);
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); go(e.dataTransfer.files[0]); });
  });
}

async function renderAssets(pid, p) {
  const body = $('#assets-body');
  if (!p.steps.audio) { body.innerHTML = `<div class="note info">자막(SRT)을 올리면 장면을 나눠 사진·영상을 모읍니다.</div>`; return; }
  if (!p.steps.assets) {
    body.innerHTML = `<p class="sub">장면마다 네이버 이미지·위키미디어·유튜브(방송사 채널 제외)에서 후보를 찾아 내려받고 출처 자막을 붙입니다. 장면 수에 따라 몇 분 걸립니다.</p>
      <button class="btn primary big" id="nc-run">자료 수집 시작</button>`;
    $('#nc-run').onclick = () => runJob(`/api/projects/${pid}/newsclip`, {}, () => route());
    return;
  }
  let data;
  try { data = await api(`/api/projects/${pid}/scenes`); } catch (e) { body.innerHTML = `<div class="note warn">${esc(e.message)}</div>`; return; }
  const none = data.scenes.filter(s => !s.chosen && !s.skipped).length;
  body.innerHTML = `
    <div class="row"><p class="sub" style="margin:0;flex:1">장면 ${data.scenes.length}개${none ? ` · <b style="color:var(--bad)">자료 없는 장면 ${none}개</b>` : ''} · 후보를 눌러 바꾸고, 영상은 시작 초를 고칠 수 있습니다.</p>
      <button class="btn" id="nc-again">다시 수집</button><button class="btn primary" id="nc-save">저장 + XML 다시 만들기</button></div>
    <div class="scenes">${data.scenes.map(sceneCard).join('')}</div>`;
  $('#nc-again').onclick = () => { if (confirm('자료를 처음부터 다시 모읍니다. 지금 고른 내용은 사라집니다. 계속할까요?')) runJob(`/api/projects/${pid}/newsclip`, {}, () => route()); };
  $('#nc-save').onclick = async () => {
    try { const r = await api(`/api/projects/${pid}/scenes/save`, { body: {} }); r.ok ? toast('저장 · timeline.xml 다시 만듦(검사 통과)') : toast('XML 검사 실패: ' + r.errors.join('; '), true); }
    catch (e) { fail(e); }
  };
  $$('.scene', body).forEach(el => bindScene(pid, el, data.scenes.find(s => s.id === el.dataset.id)));
}
function fmt(s) { const m = Math.floor(s / 60), r = (s % 60).toFixed(1); return `${m}:${r.padStart(4, '0')}`; }
function sceneCard(sc) {
  const top = sc.candidates.filter(c => c.preview).slice(0, 3);
  const chosen = sc.chosen ? sc.chosen.id : null;
  return `<div class="scene ${sc.skipped ? 'skipped' : ''}" data-id="${esc(sc.id)}">
    <div class="meta"><b>${esc(sc.id)}</b><span>${fmt(sc.start_sec)}–${fmt(sc.end_sec)}</span><span>${esc(sc.topic)}</span><span>${esc(sc.kind)}</span><span>${esc(sc.keywords_ko.join(', '))}</span></div>
    <div class="text">${esc(sc.text)}</div>
    <div class="cands">${top.length ? top.map(c => `<div class="cand ${c.id === chosen ? 'chosen' : ''}" data-a="${esc(c.id)}">
        ${c.media === 'video' ? `<video src="${esc(c.preview)}" muted preload="metadata" controls></video>` : `<img src="${esc(c.preview)}" loading="lazy" alt="">`}
        <div class="sc">${Math.round(c.score)}점 · ${esc(c.source)}</div><div class="src">${esc(c.attribution_text)}</div>
        ${c.media === 'video' ? `<div class="clip">시작 초 <input type="number" min="0" step="1" value="${esc(c.clip_start_sec ?? 0)}"> <a href="${esc(c.url)}" target="_blank" rel="noopener">원본</a></div>` : ''}
      </div>`).join('') : `<div class="small" style="color:var(--bad)">자료 없음 — 키워드: ${esc(sc.keywords_ko.join(', '))}</div>`}</div>
    <label class="small row" style="margin-top:8px"><input type="checkbox" class="skip" ${sc.skipped ? 'checked' : ''}> 건너뛰기(XML에 표시만)</label>
  </div>`;
}
function bindScene(pid, el, sc) {
  $$('.cand', el).forEach(c => {
    c.addEventListener('click', async ev => {
      if (['INPUT', 'A', 'VIDEO'].includes(ev.target.tagName)) return;
      try { await api(`/api/projects/${pid}/scenes/${sc.id}/choose`, { body: { asset_id: c.dataset.a } }); $$('.cand', el).forEach(x => x.classList.remove('chosen')); c.classList.add('chosen'); toast(`${sc.id} 선택 변경 — 저장을 눌러 XML에 반영`); }
      catch (e) { fail(e); }
    });
    const inp = $('input', c);
    if (inp) inp.onchange = () => api(`/api/projects/${pid}/scenes/${sc.id}/clip_start`, { body: { asset_id: c.dataset.a, sec: Number(inp.value) } }).then(() => toast('시작 초 변경 — 저장 시 구간을 다시 받습니다')).catch(fail);
  });
  $('.skip', el).onchange = e => api(`/api/projects/${pid}/scenes/${sc.id}/skip`, { body: { skipped: e.target.checked } }).then(() => el.classList.toggle('skipped', e.target.checked)).catch(fail);
}

    <div class="grid" style="grid-template-columns:1fr 1fr;align-items:end">
      <label class="field">영상 주소 또는 ID<input type="text" id="vid" placeholder="https://youtu.be/…"></label>
      <label class="field">실제 제목<select id="vtitle">${plan.titles.map(t => `<option>${esc(t)}</option>`).join('')}<option value="__custom">직접 입력…</option></select></label>
    </div>
    <input type="text" id="vtitle-custom" placeholder="실제로 올린 제목" style="margin-top:10px" hidden>

function bindUpload(pid) {
  const of2 = $('#of2'); if (of2) of2.onclick = e => { e.preventDefault(); $('#open-folder').click(); };
  const sel = $('#vtitle'); if (!sel) return;
  sel.onchange = () => { $('#vtitle-custom').hidden = sel.value !== '__custom'; };
  $('#made').onclick = () => {
    const video = $('#vid').value.trim();
    if (!video) { toast('영상 주소를 넣어 주세요', true); return; }
    const title = sel.value === '__custom' ? $('#vtitle-custom').value.trim() : sel.value;
    runJob(`/api/projects/${pid}/made`, { video, title }, () => route());
  };

/* ---------- 성과 ---------- */
async function historyPage() {
  app.innerHTML = `<div class="head"><div><div class="eyebrow">성과</div><h1>무엇이 잘 됐나</h1></div></div>
    <div class="card"><div class="row"><p class="sub" style="margin:0;flex:1">예측 점수와 실제 조회수, 제목 패턴, 아침 예상 적중률을 보고 점수 가중치 조정을 제안합니다.</p>
      <select id="weeks" style="width:auto"><option value="2">최근 2주</option><option value="4" selected>최근 4주</option><option value="8">최근 8주</option><option value="12">최근 12주</option></select>
      <button class="btn primary" id="run-h">분석하기</button></div>
      <div class="md" id="md" style="margin-top:10px"></div></div>`;
  $('#run-h').onclick = () => runJob('/api/jobs/history', { weeks: Number($('#weeks').value) }, job => {
    if (job.status === 'done') $('#md').innerHTML = md(job.result.markdown) + '<div class="note info" style="margin-top:12px">가중치는 <a href="#/settings">설정 → 점수 가중치</a>에서 바꿉니다.</div>';
  });
}
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const L = text.split('\n'); let h = '', i = 0;
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  while (i < L.length) {
    const l = L[i];
    if (/^\|/.test(l)) { const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      h += `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; continue; }
    const hm = l.match(/^(#{1,4}) (.*)/);
    if (hm) { const n = Math.min(hm[1].length + 1, 4); h += `<h${n}>${inline(hm[2])}</h${n}>`; i++; continue; }
    if (/^\s*[-*] /.test(l)) { h += '<ul>'; while (i < L.length && /^\s*[-*] /.test(L[i])) h += `<li>${inline(L[i++].replace(/^\s*[-*] /, ''))}</li>`; h += '</ul>'; continue; }
    if (l.trim()) h += `<p>${inline(l)}</p>`;
    i++;
  }
  return h;
}

  app.innerHTML = `

      </div>`).join('')}
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn primary" id="save-keys">키 저장</button></div></div>

    <div class="card"><h2>채널</h2><p class="sub">경쟁 채널은 공백도 점수(아무도 안 다룬 주제 가점)에 쓰입니다.</p>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <label class="field">내 채널 ID<span class="hint">UC로 시작 · 유튜브 스튜디오 → 설정 → 채널 → 고급 설정</span><input type="text" id="ch-id" value="${esc(s.channel.youtube_channel_id)}"></label>
        <label class="field">Slack 알림 주소(선택)<span class="hint">편성이 만들어지면 요약을 보냅니다(Incoming Webhook)</span><input type="text" id="ch-slack" value="${esc(s.channel.slack_webhook)}"></label>
      </div>
      <label class="field" style="margin-top:12px">경쟁 채널 ID<span class="hint">한 줄에 하나(UC…)</span><textarea id="ch-comp" rows="4">${esc(s.channel.competitors.join('\n'))}</textarea></label>
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn primary" id="save-ch">채널 저장</button></div></div>

    <div class="card"><h2>점수 가중치</h2><p class="sub">주제 총점 = 네 점수의 가중합(합계로 나눔). 성과 탭의 조정 제안을 보고 바꾸세요.</p>
      <div class="weights">${[['interest', '관심도', '커뮤니티 반응·상승세'], ['gap', '공백도', '경쟁 채널이 안 다룸'], ['persistence', '지속성', '후속 일정·며칠째'], ['fit', '적합도', '정치 핵심·원인 설명']].map(([k, l, h]) => `

      <div class="row" style="margin-top:10px"><span class="small muted" id="w-sum"></span><span class="spacer"></span><button class="btn primary" id="save-w">가중치 저장</button></div></div>
