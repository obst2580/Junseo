[project]
name = "studio"
version = "0.1.0"
description = "진보 성향 데일리 정치 해설 채널 제작 도구 (모노레포 루트)"
requires-python = ">=3.11"
dependencies = ["studio-core", "topicradar", "newsclip", "studio-app"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "topicradar", "newsclip", "app"]

[tool.uv.sources]
studio-core = { workspace = true }
topicradar = { workspace = true }
newsclip = { workspace = true }
studio-app = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["core/src", "topicradar/src", "newsclip/src", "app/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN001", "ANN201"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-local-folder = ["trh", "nch"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN001", "ANN201"]
"scripts/**" = ["ANN001", "ANN201"]
"fixtures/**" = ["ANN001", "ANN201"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "topicradar/tests", "newsclip/tests", "app/tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore::ResourceWarning", "ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source_pkgs = ["studio_core", "topicradar", "newsclip", "studio_app"]
omit = []

[tool.coverage.report]
show_missing = false
skip_covered = true
