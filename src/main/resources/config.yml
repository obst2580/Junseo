# ==========================================
#  준서 시티 (JunseoCity) 설정 파일
#  값을 바꾼 뒤 /시티관리 reload 하면 바로 적용됩니다. (database 는 서버 재시작 필요)
# ==========================================

# 서버 이름 (사이드바 제목, 환영 메시지에 표시)
server-name: "준서 시티"

# 돈 단위
currency: "원"

# 주민번호 날짜 기준 시간대
timezone: "Asia/Seoul"

# 데이터 저장소
#  sqlite : 서버 폴더 안 파일 하나 (내 PC 테스트, 소규모)
#  mysql  : MySQL / MariaDB 서버 (운영, 수백 명)
database:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: junseocity
    user: root
    password: ""
    pool-size: 4

# 캐릭터를 처음 만들면 받는 돈
starting-cash: 500
starting-bank: 2000

# 죽어도 아이템을 잃지 않음
keep-inventory: true

# 죽으면 병원비로 현금의 몇 %를 잃는지
hospital-fee-percent: 20

# true 면 폰 은행앱에서 어디서든 입금·출금, false 면 ATM이나 은행원 근처에서만 (송금은 어디서든)
bank-anywhere: false
# ATM/은행원 사용 가능 거리 (블록)
atm-range: 5

# 월급 (은행으로 입금)
paycheck:
  interval-minutes: 10
  salary:
    citizen: 100
    police: 400
    ems: 400
    delivery: 150
    miner: 150

# 강도: 접속 중인 경찰이 min-police 명 이상이어야 시작할 수 있어요
robbery:
  store:
    duration-seconds: 20
    min-reward: 1000
    max-reward: 3000
    cooldown-minutes: 5
    radius: 6
    min-police: 2
  bank:
    duration-seconds: 45
    min-reward: 8000
    max-reward: 15000
    cooldown-minutes: 15
    radius: 8
    min-police: 4

# 택배 알바
delivery:
  base-reward: 80
  reward-per-block: 1.2
  # 배달지가 하나도 등록되지 않았을 때 무작위 배달지를 고르는 거리
  random-min-distance: 80
  random-max-distance: 250
  # 제한시간의 절반 안에 배달하면 받는 보너스 비율
  fast-bonus-percent: 30

# 상점 판매 가격 (구매가)
prices:
  bread: 15
  steak: 40
  golden_apple: 500
  bandage: 120
  torch: 30
  pistol: 2000
  shotgun: 5000
  rifle: 9000
  ammo: 300
  armor: 1500
  # 자동차 (대리점). 비율은 기획서 차 가격을 따름. 돈 단위를 기획서의 원 단위로 바꿀 때 아래도 함께 키우세요
  car_compact: 6000
  car_sedan: 14000
  car_large: 22000
  car_suv: 20000
  car_sports: 60000
  # 차 유지·면허·단속
  car_tow: 40
  car_impound: 200
  car_repair_base: 20
  car_repair_percent: 8
  license: 40
  fine_no_license: 1200

# 광물 거래소에 팔 때 받는 가격 (1개당)
sell-prices:
  coal: 5
  copper_ingot: 4
  raw_iron: 12
  iron_ingot: 15
  raw_gold: 25
  gold_ingot: 30
  redstone: 3
  lapis_lazuli: 4
  emerald: 120
  diamond: 150

# 광부 직업이면 광물을 이 배수만큼 더 비싸게 팜
miner-sell-bonus: 1.5

# 리소스팩: 미니맵·큰 지도 그림. 플레이어가 접속할 때 자동으로 받습니다.
# 이 서버가 직접 작은 웹 서버(port)로 나눠 줍니다. 호스팅에서는 이 포트도 열어 주세요 (TCP).
resource-pack:
  enabled: true
  port: 8163
  # 웹 서버가 들을 주소. 비우면 모든 주소
  bind: ""
  # 플레이어가 리소스팩을 받으러 올 주소 (도메인이나 공인 IP). 비우면 플레이어가 접속할 때 쓴 주소를 그대로 씁니다
  public-host: ""
  # 리소스팩을 다른 곳(웹 호스팅 등)에 올려서 쓸 때 그 주소. 비우면 위의 내장 웹 서버를 씁니다
  #  plugins/JunseoCity/resourcepack/ 에 만들어지는 zip 을 올리면 됩니다 (플러그인을 바꾸면 다시 올리기)
  url: ""
  # true 면 리소스팩을 거절한 사람은 들어올 수 없어요
  required: false
  prompt: "준서 시티 미니맵·지도 그림이에요. 받아야 미니맵이 보여요."

# 화면 아래 미니맵 (GTA 레이더)
minimap:
  # 핫바 왼쪽(left) 또는 오른쪽(right). 왼쪽은 채팅창과 조금 겹칠 수 있어요
  side: left
  # 한 칸이 몇 블록인지 (클수록 넓게 보임). 걸을 때 / 차를 탈 때
  walk-scale: 6
  drive-scale: 10
  # 움직이거나 돌 때 미니맵을 다시 그리는 최소 간격 (ms). 작을수록 부드럽지만 네트워크를 더 씀 (한 장 약 4KB)
  update-ms: 150
  # 미니맵을 보여 줄 월드 이름. 비우면 모든 월드
  worlds: []
