<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">{{brandMark}}</span>
      <span class="brand-name">{{title}}</span>
    </div>
    <div class="realm" id="realm" hidden>
      <span id="realmName"></span>
      <span class="realm-date" id="realmDate"></span>
    </div>
    <nav class="top-actions" id="topActions" hidden>
      <button type="button" class="btn ghost" id="openRecords">기록 관리</button>
    </nav>
  </header>

  <!-- 시나리오 설정 -->
  <main id="setup" class="setup">
    <section class="hero">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1 class="hero-title">{{title}}</h1>
      <p class="hero-lede">{{lede}}</p>
    </section>

    <section class="resume" id="resume" hidden>
      <div>
        <p class="resume-label">이어하기</p>
        <p class="resume-meta" id="resumeMeta"></p>
      </div>
      <button type="button" class="btn primary" id="resumeBtn">{{resumeButton}}</button>
    </section>

    <section class="pick">
      <h2 class="section-title">{{pickTitle}}</h2>
      <div class="scenario-grid" id="scenarioGrid" role="radiogroup" aria-label="{{pickAria}}"></div>
    </section>

    <form class="setup-form" id="setupForm" novalidate>
      <h2 class="section-title">{{worldTitle}}</h2>
      <p class="form-hint">{{formHint}}</p>
      <div class="field-grid">
        <label class="field">
          <span>{{fieldCountry}}</span>
          <input id="fCountry" name="country" type="text" maxlength="40" required>
        </label>
        <label class="field">
          <span>{{fieldRuler}}</span>
          <input id="fRuler" name="ruler" type="text" maxlength="40" required>
        </label>
        <label class="field narrow">
          <span>시작 연도</span>
          <input id="fYear" name="startYear" type="number" inputmode="numeric" required>
        </label>
        <label class="field narrow">
          <span>월</span>
          <input id="fMonth" name="startMonth" type="number" min="1" max="12" inputmode="numeric" required>
        </label>
        <label class="field wide">
          <span>{{fieldInstitution}}</span>
          <textarea id="fInstitution" name="institution" rows="2" maxlength="400" required></textarea>
        </label>
        <label class="field wide">
          <span>특이사항 <em>선택</em></span>
          <textarea id="fNotes" name="notes" rows="2" maxlength="400" placeholder="{{notesPlaceholder}}"></textarea>
        </label>
      </div>
      <div class="option-row">
        <fieldset class="seg">
          <legend>{{difficultyLegend}}</legend>
          <div class="seg-options" id="difficultyOptions"></div>
        </fieldset>
        <fieldset class="seg">
          <legend>{{tierLegend}}</legend>
          <div class="seg-options" id="tierOptions"></div>
        </fieldset>
      </div>
      <p class="form-error" id="setupError" role="alert" hidden></p>
      <div class="start-row">
        <button type="submit" class="btn primary large" id="startBtn">{{startButton}}</button>
        <p class="backend" id="backendStatus">{{backendChecking}}</p>
      </div>
    </form>
  </main>

  <!-- 게임 -->
  <main id="game" class="game" hidden>
    <div class="court">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="dock" id="dock">
        <div class="chips" id="suggest" aria-label="{{suggestAria}}"></div>
        <div class="dock-main">
          <label class="sr-only" for="cmd">{{commandAria}}</label>
          <textarea id="cmd" rows="2" maxlength="600" placeholder="{{commandPlaceholder}}"></textarea>
          <button type="submit" class="btn primary" id="sendBtn">{{sendButton}}</button>
        </div>
        <div class="dock-time">
          <span class="dock-label">시간 경과</span>
          <span class="time-chips" id="timeChips"></span>
          <span class="skip-custom">
            <label class="sr-only" for="skipYears">경과할 햇수</label>
            <input id="skipYears" type="number" min="1" max="20" value="3" inputmode="numeric">
            <button type="button" class="btn chip" id="skipGo">년 후</button>
          </span>
        </div>
      </form>
    </div>

    <aside class="side" id="side">
      <button type="button" class="side-toggle" id="sideToggle" aria-expanded="false" aria-controls="sideBody">
        <span>{{sideTitle}}</span>
        <span class="side-peek" id="sidePeek"></span>
      </button>
      <div class="side-body" id="sideBody">
        <section class="panel">
          <h3 class="panel-title">{{statusTitle}}</h3>
          <div id="sideStatus"></div>
        </section>
        <section class="panel">
          <h3 class="panel-title">{{moodTitle}}</h3>
          <div id="mood"></div>
        </section>
        <section class="panel">
          <div class="tabs" role="tablist" aria-label="{{worldAria}}">
            <button type="button" role="tab" id="tab-people" aria-controls="tabBody" aria-selected="true" data-tab="people">{{tabPeople}}</button>
            <button type="button" role="tab" id="tab-policy" aria-controls="tabBody" aria-selected="false" data-tab="policy">{{tabPolicy}}</button>
            <button type="button" role="tab" id="tab-faction" aria-controls="tabBody" aria-selected="false" data-tab="faction">{{tabFaction}}</button>
            <button type="button" role="tab" id="tab-ledger" aria-controls="tabBody" aria-selected="false" data-tab="ledger" hidden>{{tabLedger}}</button>
            <button type="button" role="tab" id="tab-annals" aria-controls="tabBody" aria-selected="false" data-tab="annals">{{tabAnnals}}</button>
          </div>
          <div class="tab-body" id="tabBody" role="tabpanel"></div>
        </section>
      </div>
    </aside>
  </main>

  <div class="modal-scrim" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="btn ghost" id="modalClose" aria-label="닫기">닫기</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>
