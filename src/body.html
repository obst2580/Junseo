<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">國</span>
      <span class="brand-name">국가의 시대</span>
    </div>
    <div class="realm" id="realm" hidden>
      <span id="realmName"></span>
      <span class="realm-date" id="realmDate"></span>
    </div>
    <nav class="top-actions" id="topActions" hidden>
      <button type="button" class="btn ghost" id="openRecords">기록 관리</button>
    </nav>
  </header>

  <!-- 시나리오 설정 -->
  <main id="setup" class="setup">
    <section class="hero">
      <p class="eyebrow">역사 기반 텍스트 통치 시뮬레이션</p>
      <h1 class="hero-title">국가의 시대</h1>
      <p class="hero-lede">명을 내리되, 조정은 쉽게 따르지 않습니다. 관료는 이견을 내고, 국고는 모자라고, 지방은 버팁니다. 그 사이에서 나라를 이끄십시오.</p>
    </section>

    <section class="resume" id="resume" hidden>
      <div>
        <p class="resume-label">이어하기</p>
        <p class="resume-meta" id="resumeMeta"></p>
      </div>
      <button type="button" class="btn primary" id="resumeBtn">이어서 통치하기</button>
    </section>

    <section class="pick">
      <h2 class="section-title">시대를 고르십시오</h2>
      <div class="scenario-grid" id="scenarioGrid" role="radiogroup" aria-label="시나리오"></div>
    </section>

    <form class="setup-form" id="setupForm" novalidate>
      <h2 class="section-title">세계관</h2>
      <p class="form-hint">고른 시대가 채워집니다. 국가·시기·제도를 바꾸면 그 세계로 시작합니다. 한 번 정한 설정은 게임 도중 바뀌지 않습니다.</p>
      <div class="field-grid">
        <label class="field">
          <span>국가</span>
          <input id="fCountry" name="country" type="text" maxlength="40" required>
        </label>
        <label class="field">
          <span>군주 (플레이어)</span>
          <input id="fRuler" name="ruler" type="text" maxlength="40" required>
        </label>
        <label class="field narrow">
          <span>시작 연도</span>
          <input id="fYear" name="startYear" type="number" inputmode="numeric" required>
        </label>
        <label class="field narrow">
          <span>월</span>
          <input id="fMonth" name="startMonth" type="number" min="1" max="12" inputmode="numeric" required>
        </label>
        <label class="field wide">
          <span>제도</span>
          <textarea id="fInstitution" name="institution" rows="2" maxlength="400" required></textarea>
        </label>
        <label class="field wide">
          <span>특이사항 <em>선택</em></span>
          <textarea id="fNotes" name="notes" rows="2" maxlength="400" placeholder="예: 왕비의 외척이 병권을 쥐고 있다"></textarea>
        </label>
      </div>
      <div class="option-row">
        <fieldset class="seg">
          <legend>조정의 협조</legend>
          <div class="seg-options" id="difficultyOptions"></div>
        </fieldset>
        <fieldset class="seg">
          <legend>사관의 깊이</legend>
          <div class="seg-options" id="tierOptions"></div>
        </fieldset>
      </div>
      <p class="form-error" id="setupError" role="alert" hidden></p>
      <div class="start-row">
        <button type="submit" class="btn primary large" id="startBtn">즉위하기</button>
        <p class="backend" id="backendStatus">사관 연결을 확인하는 중…</p>
      </div>
    </form>
  </main>

  <!-- 게임 -->
  <main id="game" class="game" hidden>
    <div class="court">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="dock" id="dock">
        <div class="chips" id="suggest" aria-label="명령 후보"></div>
        <div class="dock-main">
          <label class="sr-only" for="cmd">왕명</label>
          <textarea id="cmd" rows="2" maxlength="600" placeholder="왕명을 내리십시오. 예: 북방에 진을 설치하라"></textarea>
          <button type="submit" class="btn primary" id="sendBtn">하명</button>
        </div>
        <div class="dock-time">
          <span class="dock-label">시간 경과</span>
          <button type="button" class="btn chip" data-days="15">보름 후</button>
          <button type="button" class="btn chip" data-months="1">다음 달</button>
          <button type="button" class="btn chip" data-months="12">1년 후</button>
          <button type="button" class="btn chip" data-months="60">5년 후</button>
          <span class="skip-custom">
            <label class="sr-only" for="skipYears">경과할 햇수</label>
            <input id="skipYears" type="number" min="1" max="20" value="3" inputmode="numeric">
            <button type="button" class="btn chip" id="skipGo">년 후</button>
          </span>
        </div>
      </form>
    </div>

    <aside class="side" id="side">
      <button type="button" class="side-toggle" id="sideToggle" aria-expanded="false" aria-controls="sideBody">
        <span>국정 현황</span>
        <span class="side-peek" id="sidePeek"></span>
      </button>
      <div class="side-body" id="sideBody">
        <section class="panel">
          <h3 class="panel-title">상태창</h3>
          <div id="sideStatus"></div>
        </section>
        <section class="panel">
          <h3 class="panel-title">조정 기류</h3>
          <div id="mood"></div>
        </section>
        <section class="panel">
          <div class="tabs" role="tablist" aria-label="세계 기록">
            <button type="button" role="tab" id="tab-people" aria-controls="tabBody" aria-selected="true" data-tab="people">인물</button>
            <button type="button" role="tab" id="tab-policy" aria-controls="tabBody" aria-selected="false" data-tab="policy">정책</button>
            <button type="button" role="tab" id="tab-faction" aria-controls="tabBody" aria-selected="false" data-tab="faction">세력</button>
            <button type="button" role="tab" id="tab-annals" aria-controls="tabBody" aria-selected="false" data-tab="annals">연대기</button>
          </div>
          <div class="tab-body" id="tabBody" role="tabpanel"></div>
        </section>
      </div>
    </aside>
  </main>

  <div class="modal-scrim" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="btn ghost" id="modalClose" aria-label="닫기">닫기</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>
