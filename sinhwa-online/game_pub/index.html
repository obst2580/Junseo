<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTK: Grand Theft Korea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Full-bleed game view: title / help top-left, status top-right, minimap bottom-right, touch stick bottom-left. */
:root { --ink: #eef0e6; --dim: #aab3a2; --panel: rgba(16, 20, 16, .78); --line: #3b483a; --acc: #e2cf72; --key: #283126;
  --f: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --m: "IBM Plex Mono", ui-monospace, monospace; color-scheme: dark }
html, body { height: 100%; margin: 0; overflow: hidden; background: #a9bccb; color: var(--ink); font-family: var(--f); font-size: 13px }
[hidden] { display: none !important }
#v { position: fixed; inset: 0 } #v canvas { display: block; width: 100%; height: 100%; touch-action: none }
.panel { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(290px, calc(100vw - 24px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 7px }
.panel h1 { margin: 0; font-size: 15px } .panel h1 small { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 6px }
.row { display: flex; flex-wrap: wrap; gap: 5px }
button { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--key); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; cursor: pointer }
button[aria-pressed="true"] { background: var(--acc); color: #1b1d14; border-color: var(--acc) }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px }
.help { color: var(--dim); font-size: 12px; line-height: 1.6 }
.hud { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-family: var(--m); font-size: 12px; line-height: 1.6; font-variant-numeric: tabular-nums }
#mini { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 190px; height: 190px;
  border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); background: #1d241c; overflow: hidden }
#mini canvas { width: 100%; height: 100% }
#load { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #2a2f26, #0d0f0b 75%); color: #e9e4cf; font-size: 15px; text-align: center; line-height: 1.7; z-index: 20 }
#load .tk { font: 400 clamp(84px, 22vw, 200px)/.9 "Black Han Sans", var(--f); letter-spacing: .06em; color: #f3e3a8; text-shadow: 0 6px 0 #5a2a0c, 0 0 40px rgba(240,170,60,.35) }
#load .te { font: 700 clamp(15px, 3.6vw, 26px) var(--f); letter-spacing: .42em; text-transform: uppercase; color: #e2cf72; margin-top: 10px; padding-left: .42em }
#load .tko { font: 600 clamp(13px, 2.8vw, 18px) var(--f); letter-spacing: .5em; color: #b9b39a; margin-top: 4px; padding-left: .5em }
#loadmsg { margin-top: 36px; font-size: 13px; color: #9aa38f; min-height: 1.7em }
#stick { position: fixed; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .5); background: rgba(0, 0, 0, .15); touch-action: none; display: none }
#stick i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, .7) }
@media (pointer: coarse) { #stick { display: block } #mini { width: 130px; height: 130px } }
/* fight HUD: health bars top centre, strike gauge bottom centre, touch attack above the minimap */
#bars { background: rgba(16,20,16,.55); border-radius: 8px; padding: 6px 10px; position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 340px)); min-width: 170px; display: grid; gap: 6px; pointer-events: none }
#bars .bl { display: flex; justify-content: space-between; font-size: 11.5px; color: #f1efe4; text-shadow: 0 1px 2px #000; margin-bottom: 2px }
#bars .bb { height: 10px; border-radius: 5px; background: rgba(10,12,10,.7); border: 1px solid rgba(255,255,255,.35); overflow: hidden }
#bars .bb i { display: block; height: 100%; background: linear-gradient(90deg, #3fa45a, #8bd36a); transition: width .2s }
#tbar .bb i { background: linear-gradient(90deg, #b8322a, #e86a4a) }
#finfo { text-align: center; font-size: 12px; color: #fff3d0; text-shadow: 0 1px 3px #000; min-height: 16px }
@media (max-width: 720px) { #bars { top: auto; bottom: calc(170px + env(safe-area-inset-bottom, 0px)); width: calc(100vw - 48px) } }
#atkpad { position: fixed; right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(160px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%; font: 700 17px var(--f); color: #1b1d14; background: var(--acc); border: 3px solid rgba(255,255,255,.7); display: none; touch-action: manipulation }
@media (pointer: coarse) { #atkpad { display: block } }
#gauge { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100vw - 420px)); min-width: 170px; text-align: center; pointer-events: none }
#gauge .gl { font-size: 11.5px; color: #f1efe4; text-shadow: 0 1px 2px #000; letter-spacing: .08em; margin-bottom: 4px }
#gauge .gb { height: 12px; border-radius: 6px; background: rgba(10,12,10,.7); border: 1px solid rgba(255,255,255,.35); overflow: hidden }
#gauge .gb i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c94b2a, #f0a33a); transition: width .15s }
#gauge.full .gb i { background: linear-gradient(90deg, #f6d46a, #fff4c2, #f6d46a); animation: gpulse .5s infinite alternate }
#gauge .gr { display: none; margin-top: 5px; font-weight: 700; color: #ffe27a; text-shadow: 0 1px 3px #000 } #gauge.full .gr { display: block }
#gauge kbd { font: 600 11px var(--m); background: #283126; border: 1px solid #556; border-radius: 3px; padding: 0 4px }
@keyframes gpulse { from { filter: brightness(1) } to { filter: brightness(1.5) } }
#execbtn { position: fixed; right: calc(132px + env(safe-area-inset-right, 0px)); bottom: calc(166px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; border-radius: 50%; font: 800 17px var(--f);
  color: #2a0a00; background: #ffb44a; border: 3px solid #fff3c4; animation: gpulse .5s infinite alternate }
#lbtop, #lbbot { position: fixed; left: 0; right: 0; height: min(30vh, max(9vh, calc((100vh - 100vw / 2.39) / 2))); background: #000; pointer-events: none; z-index: 5;
  transition: transform .7s cubic-bezier(.65, 0, .25, 1) .05s; box-shadow: 0 0 24px 6px rgba(0,0,0,.55) }   /* 2.39:1 cinemascope bars */
#lbtop { top: 0; transform: translateY(-110%) } #lbbot { bottom: 0; transform: translateY(110%) }
body.cut #lbtop, body.cut #lbbot { transform: none; transition-delay: 0s }
body.cut .panel, body.cut .hud, body.cut #gauge, body.cut #atkpad, body.cut #stick, body.cut #execbtn, body.cut #bars, body.cut #mini { visibility: hidden }
#cuttitle { position: fixed; left: 0; right: 0; top: 42%; text-align: center; font: 900 clamp(40px, 9vw, 96px) "Black Han Sans", var(--f); color: #fff3d0; letter-spacing: .04em;
  text-shadow: 0 4px 0 #6b1c00, 0 0 30px rgba(255,120,40,.8); opacity: 0; transform: scale(1.6); transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); pointer-events: none; z-index: 6 }
#cuttitle small { display: block; font: 700 clamp(14px, 2.4vw, 22px) var(--f); color: #ffe2b0; letter-spacing: .3em; margin-top: 6px }
#cuttitle.on { opacity: 1; transform: scale(1) }
#kotext { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font: 900 clamp(36px, 8vw, 80px) "Black Han Sans", var(--f); color: #fff; text-shadow: 0 4px 0 #400, 0 0 24px #000;
  background: radial-gradient(ellipse at center, rgba(40,0,0,.15), rgba(20,0,0,.75)); opacity: 0; transition: opacity .6s }
#kotext.on { opacity: 1 }
#sub { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-width: min(900px, calc(100vw - 40px)); text-align: center; pointer-events: none; z-index: 8;
  font: 400 clamp(17px, 2.06vw, 34px)/1.4 "Noto Sans KR", var(--f); color: #fff; letter-spacing: .075em; word-break: keep-all;
  -webkit-text-stroke: 1.7px #000; paint-order: stroke fill; text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 6px rgba(0,0,0,.45); opacity: 0; transition: opacity .15s }
#sub.on { opacity: 1 }
body.cut #sub { bottom: calc(min(30vh, max(9vh, calc((100vh - 100vw / 2.39) / 2))) / 2 - .7em) }   /* in the cutscene: inside the lower black bar */
@media (pointer: coarse) { #sub { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 280px); min-width: 200px } }
#busted { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; font: 900 clamp(48px, 11vw, 110px) "Black Han Sans", var(--f); color: #e9f0ff; letter-spacing: .1em;
  text-shadow: 0 4px 0 #0b1f5c, 0 0 30px rgba(60,110,255,.7); background: radial-gradient(ellipse at center, rgba(0,10,40,.2), rgba(0,6,30,.8)); opacity: 0; transition: opacity .5s; z-index: 7 }
#busted small { display: block; font: 600 clamp(13px, 2.2vw, 18px) var(--f); letter-spacing: .3em; color: #b9c8ff; margin-top: 8px }
#busted.on { opacity: 1; animation: bflash .5s steps(2) 3 }
@keyframes bflash { 50% { background: radial-gradient(ellipse at center, rgba(60,0,0,.25), rgba(40,0,10,.8)) } }
#wanted { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(78px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 2px; padding: 4px 8px; border-radius: 8px; background: rgba(16,20,16,.6); pointer-events: none }
#wanted span { font-size: 11px; color: #f1efe4; margin-right: 5px; letter-spacing: .1em }
#wanted i { font-style: normal; font-size: 21px; line-height: 1; color: rgba(255,255,255,.18); text-shadow: 0 1px 2px #000 }
#wanted i.on { color: #ffd23a }
#wanted.search i.on { animation: wblink .7s infinite alternate }
#wanted.flash i.on { color: #fff; text-shadow: 0 0 10px #ffd23a }
@keyframes wblink { to { opacity: .25 } }
body.cut #wanted { visibility: hidden }
#fxflash, #fxvig { position: fixed; inset: 0; pointer-events: none; opacity: 0 }
#fxflash { background: radial-gradient(circle at 50% 45%, rgba(255,250,235,.95), rgba(255,240,210,.55) 45%, rgba(255,230,200,0) 80%) }
#fxvig { background: radial-gradient(ellipse at center, rgba(160,0,0,0) 45%, rgba(150,0,0,.55) 100%) }
</style>

<body>
<div id="v"></div>
<section class="panel" aria-label="게임 정보">
  <h1>GTK<small>한국의 위대한 도둑 · 신화2리</small></h1>
  <div class="row" id="views"></div>
  <div class="help"><b>WASD</b> 걷기 · <b>Shift</b> 달리기 · 화면 클릭 후 <b>마우스</b>로 둘러보기(<b>Esc</b> 해제) · 휠 거리<br><b>클릭</b> 또는 <b>J</b> 공격(거리·상황 따라 기술이 바뀜) · 게이지가 차면 <b>E</b> 처형 · 달리면서 맞으면 잘 피함<br>주민을 때리면 <b>수배</b>: 경찰이 출동, 쓰러지면 체포 · 시야에서 벗어나면 별이 줄어듦</div>
</section>
<div class="hud" id="hud">불러오는 중</div>
<div id="mini"><canvas id="minic" width="380" height="380"></canvas></div>

<div id="bars"><div><div class="bl"><span>민석</span></div><div class="bb"><i id="php"></i></div></div><div id="tbar" hidden><div class="bl"><span id="tname"></span></div><div class="bb"><i id="thp"></i></div></div><div id="finfo"></div></div>
<button type="button" id="atkpad" aria-label="공격">공격</button>
<div id="gauge" hidden><div class="gl">타격 게이지</div><div class="gb"><i></i></div><div class="gr">처형 가능! <kbd>E</kbd></div></div>
<button type="button" id="execbtn" hidden>처형</button>
<div id="lbtop" aria-hidden="true"></div><div id="lbbot" aria-hidden="true"></div><div id="cuttitle" aria-hidden="true"></div>
<div id="sub" role="status" aria-live="polite"></div>
<div id="kotext" aria-hidden="true">기절!</div>
<div id="busted" aria-hidden="true"><div>체포<small>연무지구대로 연행 중…</small></div></div>
<div id="wanted" hidden aria-label="수배 단계"><span>수배</span><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div>
<div id="fxflash" aria-hidden="true"></div><div id="fxvig" aria-hidden="true"></div>
<div id="load"><div class="tc"><div class="tk">GTK</div><div class="te">Grand Theft Korea</div><div class="tko">한국의 위대한 도둑</div><div id="loadmsg">신화리 들어가는 중…</div></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { pass, mrt, output, normalView, velocity, uniform, texture, uv, vec2, vec3, vec4, float, mix, smoothstep, clamp, fract, length, sin, cos, step as tstep, max, min,
  positionWorld, positionLocal, cameraPosition, attribute, instancedDynamicBufferAttribute, varying, Fn, lights, fog, densityFogFactor, color, screenUV, select, equirectUV, positionWorldDirection } from 'three/tsl';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const $ = id => document.getElementById(id);
const say = t => { $('loadmsg').textContent = t; };
window.addEventListener('error', e => { $('load').hidden = false; $('loadmsg').textContent = '오류: ' + e.message; });

// ---------------------------------------------------------------- renderer (WebGPU, falls back to WebGL2 where WebGPU is missing)
const r = new THREE.WebGPURenderer({ antialias: false, powerPreference: 'high-performance', forceWebGL: new URLSearchParams(location.search).has('webgl') });
r.setPixelRatio(Math.min(devicePixelRatio, 1.5)); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.AgXToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
await r.init();
$('v').appendChild(r.domElement);
const BACKEND = r.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2';
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .1, 6000);
const ctl = new OrbitControls(cam, r.domElement); ctl.enablePan = false; ctl.maxPolarAngle = Math.PI * .49; ctl.minDistance = 1.5; ctl.maxDistance = 900;
const maxAniso = r.getMaxAnisotropy ? r.getMaxAnisotropy() : 8;
const glbFrom = (jsonText, b64) => { const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0)), jb = new TextEncoder().encode(jsonText);
  const jl = jb.length + (4 - jb.length % 4) % 4, bl = bin.length + (4 - bin.length % 4) % 4, total = 28 + jl + bl, buf = new ArrayBuffer(total), dv = new DataView(buf), u8 = new Uint8Array(buf);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true); dv.setUint32(12, jl, true); dv.setUint32(16, 0x4E4F534A, true); u8.fill(0x20, 20, 20 + jl); u8.set(jb, 20);
  dv.setUint32(20 + jl, bl, true); dv.setUint32(24 + jl, 0x004E4942, true); u8.set(bin, 28 + jl); return buf; };
const tl = new THREE.TextureLoader();
const tex = async (u, srgb = true) => { const t = await tl.loadAsync(u); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = maxAniso; return t; };

// ---------------------------------------------------------------- data
say('지형 읽는 중…');
const [W, HJ, VB] = await Promise.all(['world.json', 'height.json', 'village/bake.json'].map(u => fetch(u).then(x => x.json())));
const REG = VB.region;                                   // the playable area: the baked 신화2리 (game coords x east, y north)
const hraw = Uint8Array.from(atob(HJ.data), c => c.charCodeAt(0)); const hu = new Uint16Array(hraw.buffer);
const HW = HJ.w, HH = HJ.h, HS = HJ.step; const HF = new Float32Array(HW * HH); for (let i = 0; i < HF.length; i++) HF[i] = HJ.hmin + hu[i] * HJ.scale;
function demAt(x, y) {
  let i = (x - HJ.x0) / HS, j = (y - HJ.y0) / HS; i = Math.min(Math.max(i, 0), HW - 1.001); j = Math.min(Math.max(j, 0), HH - 1.001);
  const i0 = i | 0, j0 = j | 0, ti = i - i0, tj = j - j0, a = HF[j0 * HW + i0], b = HF[j0 * HW + i0 + 1], c = HF[(j0 + 1) * HW + i0], d = HF[(j0 + 1) * HW + i0 + 1];
  return (a * (1 - ti) + b * ti) * (1 - tj) + (c * (1 - ti) + d * ti) * tj;
}
// walking height: the top of what was actually baked (ground, yards, roads, banks) on a 0.5 m grid, the DEM elsewhere
const SG = { res: .5, w: 0, h: 0, z: null };
function heightAt(x, y) {
  if (SG.z) { const i = Math.round((x - REG[0]) / SG.res), j = Math.round((y - REG[1]) / SG.res);
    if (i >= 0 && j >= 0 && i < SG.w && j < SG.h) { const v = SG.z[j * SG.w + i]; if (v > -1e8) return v; } }
  return demAt(x, y);
}
const V = (x, y, z) => new THREE.Vector3(x, z, -y);   // game -> three
const inReg = (x, y, m = 0) => x > REG[0] + m && x < REG[2] - m && y > REG[1] + m && y < REG[3] - m;

// ---------------------------------------------------------------- sky + image-based light (the same HDRI the bake used)
say('하늘 펴는 중…');
{ const j = await (await fetch('sky_env.json')).json(); const b = Uint8Array.from(atob(j.data), c => c.charCodeAt(0)); const hd = new RGBELoader().parse(b.buffer);
  const t = new THREE.DataTexture(hd.data, hd.width, hd.height, THREE.RGBAFormat, hd.type); t.flipY = true; t.minFilter = t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.LinearSRGBColorSpace; t.needsUpdate = true;
  scene.environment = t; scene.environmentIntensity = .9; }
const skyBg = await tl.loadAsync('sky_bg.jpg'); skyBg.colorSpace = THREE.SRGBColorSpace;
const FOGC = new THREE.Color('#b9c8d2');
scene.backgroundNode = mix(color(FOGC), texture(skyBg, equirectUV(positionWorldDirection)).rgb, smoothstep(-.02, .06, positionWorldDirection.y));
const fogDensity = uniform(.0016);
scene.fogNode = fog(color(FOGC), densityFogFactor(fogDensity));
// sun aligned with the baked sun (Blender dir -> three), lights only characters + grass + the far terrain
const sb = VB.sun.split(',').map(Number), SUN = new THREE.Vector3(sb[0], sb[2], -sb[1]).normalize();   // towards the sun
const sun = new THREE.DirectionalLight('#fff0dc', 3.0); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 160 }); sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight('#cfe0ee', '#6b6545', .55); scene.add(hemi);

// ---------------------------------------------------------------- baked village (Blender Cycles lightmaps)
say('마을 불러오는 중…');
const LI = VB.lmax * Math.PI;
const lmTex = async u => { const t = await tl.loadAsync('village/' + u); t.flipY = false; t.channel = 1; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const LMV = { ground: await lmTex('lm_ground.jpg'), build: await lmTex('lm_build.jpg') };
const ONE = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1); ONE.needsUpdate = true; ONE.channel = 1;
const mask = await tl.loadAsync('village/groundmask.png'); mask.flipY = false; mask.colorSpace = THREE.NoColorSpace;
const paddyT = await tex('village/paddy.jpg'), gravelT = await tex('gravel.jpg');
const NO_LIGHTS = lights([]);
// surfaces by kind: painted corrugated steel and metal trims are glossy, painted plaster semi-gloss, asphalt / concrete a soft sheen
function gloss(n) {
