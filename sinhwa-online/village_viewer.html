<title>신화리 재질 테스트 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>

:root{
  --panel:rgba(14,18,16,.84); --line:#38423a; --ink:#f2f4ec; --mute:#a9b2a2; --accent:#e8424f; --ok:#8fcf6a;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#1b211d;color:var(--ink);font-family:var(--f-body)}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
.card{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:min(330px,calc(100vw - 28px));box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05}
.card h1 span{color:var(--accent)}
.card p{margin:3px 0 0;font-size:12.5px;line-height:1.5;color:var(--mute)}
.grp{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{flex:1 1 auto;min-width:0;background:#1d241f;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:7px 9px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#stats{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}
#hint{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;max-width:calc(100vw - 28px);box-sizing:border-box}
#veil{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1b211d;transition:opacity .5s;z-index:5}
#veil b{font-family:var(--f-display);font-weight:400;font-size:26px}
#bar{width:min(320px,70vw);height:6px;background:#2b342d;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#veil small{color:var(--mute);font-size:12.5px}
</style>

  </div>
  <div class="grp"><span class="lbl">카메라</span>

</div>

      float n1 = texture2D(noiseMap, vWPos.xz * .06).r, n2 = texture2D(noiseMap, vWPos.xz * .5 + 7.3).r;
      float stain = smoothstep(.6, .85, n2) * .45 + smoothstep(.55, .9, n1) * .25;                     // oil / water stains
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(.55, .52, .48), stain);
      diffuseColor.rgb *= mix(.86, 1.04, n1);`;
    sh.fragmentShader = 'uniform sampler2D noiseMap; varying vec3 vWPos;\n' + sh.fragmentShader.replace('#include <map_fragment>', '#include <map_fragment>' + body);
    if (prev) prev(sh);
  };
  const key = m.customProgramCacheKey ? m.customProgramCacheKey() : '';
  m.customProgramCacheKey = () => key + '|w-' + kind;
  m.needsUpdate = true;
}
root.traverse(o => { if (!o.isMesh) return; for (const m of [].concat(o.material)) {
  if (m.userData.weathered) continue;
  for (const kind in WEATHER) if (WEATHER[kind].includes(m.name)) { weather(m, kind); m.userData.weathered = true; }
} });

/* ---------- grass: individual blades (GPU instanced), a 64 m field that wraps around the camera ---------- */
// Each blade is real geometry (5 triangles). Positions wrap around the camera in the vertex shader, density and
// lighting come from the ground mask and the baked ground lightmap, so the field costs nothing on the CPU.
const grassUniforms = { time: { value: 0 }, camPos: { value: new THREE.Vector3() } };
{
  const S = 72, COUNT = 700000;
  const lmTex = await texLoader.loadAsync('lm_ground.jpg'); lmTex.flipY = false; lmTex.colorSpace = THREE.NoColorSpace;
  const base = new THREE.InstancedBufferGeometry();
  // blade cross-section: x in [-.5,.5] (scaled by width), y = height fraction t
  const ts = [0, .3, .58, .82], P = [];
  for (const t of ts) { const w = 1 - t * .85; P.push(-.5 * w, t, 0, .5 * w, t, 0); }
  P.push(0, 1, 0);
  const idx = [];
  for (let i = 0; i < ts.length - 1; i++) { const a0 = i * 2; idx.push(a0, a0 + 1, a0 + 3, a0, a0 + 3, a0 + 2); }
  const last = (ts.length - 1) * 2; idx.push(last, last + 1, last + 2);
  base.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); base.setIndex(idx);
  const off = new Float32Array(COUNT * 4);
  for (let i = 0; i < COUNT; i++) { off[i * 4] = Math.random() * S; off[i * 4 + 1] = Math.random() * S; off[i * 4 + 2] = Math.random(); off[i * 4 + 3] = Math.random(); }
  base.setAttribute('iOff', new THREE.InstancedBufferAttribute(off, 4));
  base.instanceCount = COUNT;
  const mat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, fog: true,
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { time: { value: 0 }, camPos: { value: new THREE.Vector3() }, S: { value: S },
      maskMap: { value: null }, lmMap: { value: null }, lmax: { value: bake.lmax }, hMap: { value: null },
      reg: { value: new THREE.Vector4(...(bake.region || [-180, -180, 180, 180])) }, hr: { value: new THREE.Vector2(bake.hlo || 0, bake.hhi || 0) } }]),
    vertexShader: `
      attribute vec4 iOff; uniform float time, S, lmax; uniform vec3 camPos; uniform sampler2D maskMap, lmMap, hMap; uniform vec4 reg; uniform vec2 hr;
      varying vec3 vLight; varying float vT; varying float vDry;
      #include <fog_pars_vertex>
      void main() {
        vec2 p = camPos.xz + mod(iOff.xy - camPos.xz + S * .5, S) - S * .5;          // wrap the patch around the camera
        vec2 muv = vec2((p.x - reg.x) / (reg.z - reg.x), (p.y + reg.w) / (reg.w - reg.y));
        vec3 hc = texture2D(hMap, muv).rgb; float gy = hr.y > hr.x ? hr.x + (hc.r * 65280. + hc.g * 255.) / 65535. * (hr.y - hr.x) : 0.;
        float inReg = step(0., muv.x) * step(muv.x, 1.) * step(0., muv.y) * step(muv.y, 1.);
        float dens = texture2D(maskMap, muv).b;
        float dist = length(p - camPos.xz);
        // far blades: fewer but wider, so the meadow reaches further at the same cost
        float lod = smoothstep(9., 30., dist);
        float keep = inReg * step(iOff.z, pow(dens, 1.4) * mix(1., .4, lod)) * (1. - smoothstep(S * .36, S * .49, dist));
        float h = mix(.16, .42, fract(iOff.w * 7.13)) * mix(.7, 1.35, dens) * keep;
        float w = mix(.035, .07, fract(iOff.z * 13.7)) * mix(1., 2.3, lod) * step(.001, keep);
        float ang = iOff.w * 6.2832;
        vec2 dir = vec2(cos(ang), sin(ang)), side = vec2(-dir.y, dir.x);
        float t = position.y;
        float wind = sin(time * 1.7 + p.x * .21 + p.y * .17) * .5 + sin(time * 3.3 + p.x * .9) * .2;
        float bend = (fract(iOff.z * 31.1) * .5 + .15 + wind * .35) * t * t * h;
        vec3 wp = vec3(p.x, gy - .03, p.y) + vec3(side.x, 0., side.y) * position.x * w + vec3(dir.x, 0., dir.y) * bend + vec3(0., t * h, 0.);
        vec3 L = lmax * pow(texture2D(lmMap, muv).rgb, vec3(2.2));
        vLight = L; vT = t; vDry = step(.45, fract(iOff.w * 3.71)) * (.5 + .5 * fract(iOff.z * 5.3));
        vec4 mvPosition = viewMatrix * vec4(wp, 1.);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      varying vec3 vLight; varying float vT; varying float vDry;
      #include <common>
      #include <fog_pars_fragment>
      void main() {
        vec3 root = vec3(.035, .06, .018), tip = vec3(.22, .32, .07), dry = vec3(.42, .36, .16);
        vec3 col = mix(root, mix(tip, dry, vDry), smoothstep(0., 1., vT));
        col *= vLight * (.55 + .6 * vT);                                             // ambient-occluded roots, sunlit tips
        gl_FragColor = vec4(col, 1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
  });
  mat.uniforms.maskMap.value = maskTex; mat.uniforms.lmMap.value = lmTex;
  if (bake.region) { const hm = await texLoader.loadAsync('heightmap.png'); hm.flipY = false; hm.colorSpace = THREE.NoColorSpace; hm.minFilter = hm.magFilter = THREE.NearestFilter; hm.generateMipmaps = false; mat.uniforms.hMap.value = hm; }
  grassUniforms.time = mat.uniforms.time; grassUniforms.camPos = mat.uniforms.camPos;
  const grass = new THREE.Mesh(base, mat); grass.frustumCulled = false; scene.add(grass);
  window.__grass = COUNT; window.__vc = vcCheck[1] ? vcCheck[0] / vcCheck[1] : -1;
}

/* ---------- post-processing ---------- */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(renderer.getPixelRatio());
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.blendIntensity = .55; gtao.updateGtaoMaterial({ radius: .6, distanceExponent: 1.5, thickness: 1, scale: 1 });
composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .06, .4, .95);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, contrast: { value: 1.08 }, saturation: { value: .9 }, warmth: { value: .015 }, vignette: { value: 0 }, grain: { value: .018 }, seed: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float contrast, saturation, warmth, vignette, grain, seed; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv);
      float l = dot(c.rgb, vec3(.2126,.7152,.0722));
      c.rgb = mix(vec3(l), c.rgb, saturation);
      c.rgb = (c.rgb - .18) * contrast + .18;
      c.rgb *= vec3(1. + warmth, 1., 1. - warmth);
      float d = distance(vUv, vec2(.5)); c.rgb *= 1. - vignette * smoothstep(.35, .85, d);
      float gr = fract(sin(dot(vUv * 1000. + seed, vec2(12.9898, 78.233))) * 43758.5453) - .5;   // fine film grain
      c.rgb += gr * grain * (.35 + c.rgb);
      gl_FragColor = c; }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());
let usePost = true;

/* ---------- cameras ---------- */
const CAMS = {
  hall:   { p: [14, 9, 34], t: [-3, 2.4, 2] },
  eye:    { p: [3.5, 1.65, 24], t: [-3, 2.2, 4] },
  yard:   { p: [-24, 4, 22], t: [-6, 1.5, 12] },
  house:  { p: [36, 6, 46], t: [26, 2, 80] },
  ware:   { p: [-20, 8, 12], t: [-50, 3, -16] },
  village:{ p: [8, 14, -2], t: [36, 2, -40] },
  aerial: { p: [130, 150, 170], t: [10, 0, 20] },
};
let camAnim = null;
function setCam(name, instant) {
  const c = CAMS[name], p = new THREE.Vector3(...c.p), t = new THREE.Vector3(...c.t);
  if (instant) { camera.position.copy(p); controls.target.copy(t); controls.update(); return; }
  camAnim = { p0: camera.position.clone(), t0: controls.target.clone(), p, t, k: 0 };
}
function seg(id, fn) { const box = $(id); box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; for (const x of box.children) x.setAttribute('aria-pressed', x === b); fn(b.dataset.v); }); }
seg('#segCam', v => { if (walk) { for (const b of $('#segMode').children) b.setAttribute('aria-pressed', b.dataset.v === 'orbit'); setMode('orbit'); } setCam(v); });
// "조명 끄기" shows the same materials lit only by the sky image, i.e. what the scene looks like without the bake
seg('#segLm', v => {
  for (const m of lmMats) {
    m.lightMapIntensity = v === 'on' ? LM_INTENSITY : 0;
    m.envMapIntensity = v === 'on' ? (m.userData.envOn ?? .08) : 1;
  }
});
seg('#segPost', v => { usePost = v === 'on'; });

/* ---------- walk mode: eye height 1.65 m, WASD + mouse drag to look ---------- */
let walk = false, yaw = 0, pitch = 0, dragging = false, lx = 0, ly = 0;
const keys = new Set();
addEventListener('keydown', e => { if (walk) { keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
renderer.domElement.addEventListener('pointerdown', e => { if (!walk) return; dragging = true; lx = e.clientX; ly = e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e => { if (!walk || !dragging) return; yaw -= (e.clientX - lx) * .004; pitch = Math.max(-1.3, Math.min(1.3, pitch - (e.clientY - ly) * .004)); lx = e.clientX; ly = e.clientY; });
renderer.domElement.addEventListener('pointerup', () => dragging = false);
function setMode(v) {
  walk = v === 'walk'; controls.enabled = !walk; camAnim = null;
  if (walk) {
    const d = new THREE.Vector3().subVectors(controls.target, camera.position); yaw = Math.atan2(-d.x, -d.z); pitch = 0;
    camera.position.y = 1.65;
    $('#hint').textContent = 'W A S D 이동 · Shift 달리기 · 드래그로 둘러보기';
  } else {
    const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)); controls.target.copy(camera.position).addScaledVector(f, 8); controls.target.y = 1.4;
    $('#hint').textContent = '드래그 회전 · 휠 확대 · 우클릭 드래그 이동';
  }
}
seg('#segMode', setMode);
function walkStep(dt) {
  const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 9 : 4) * dt;
  const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  if (keys.has('KeyW') || keys.has('ArrowUp')) camera.position.addScaledVector(f, sp);
  if (keys.has('KeyS') || keys.has('ArrowDown')) camera.position.addScaledVector(f, -sp);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) camera.position.addScaledVector(r, -sp);
  if (keys.has('KeyD') || keys.has('ArrowRight')) camera.position.addScaledVector(r, sp);
  camera.position.y = 1.65;
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  composer.setSize(innerWidth, innerHeight); gtao.setSize(innerWidth, innerHeight);
});

/* ---------- run ---------- */
setCam('hall', true);
$('#stats').textContent = `삼각형 ${Math.round(tris / 1000)}k · 풀잎 ${Math.round(window.__grass / 1000)}k`;
// adaptive quality: if the frame rate stays low, step down resolution -> AO -> grass -> bloom
let quality = 0, slowFor = 0;
const QUALITY_NAMES = ['최고', '높음', '보통', '낮음', '최저'];
function stepDown() {
  quality++;
  if (quality === 1) { renderer.setPixelRatio(1); composer.setPixelRatio(1); composer.setSize(innerWidth, innerHeight); }
  if (quality === 2) gtao.enabled = false;
  if (quality === 3) { const gm = scene.children.find(o => o.geometry && o.geometry.isInstancedBufferGeometry); if (gm) gm.geometry.instanceCount = 300000; }
  if (quality === 4) { bloom.enabled = false; const gm = scene.children.find(o => o.geometry && o.geometry.isInstancedBufferGeometry); if (gm) gm.geometry.instanceCount = 140000; }
}
let frames = 0, t0 = performance.now(), lastT = performance.now();
renderer.setAnimationLoop(() => {
  const nowT = performance.now(), dt = Math.min(.05, (nowT - lastT) / 1000); lastT = nowT;
  if (walk) walkStep(dt);
  if (camAnim) {
    camAnim.k = Math.min(1, camAnim.k + .025); const e = camAnim.k < .5 ? 2 * camAnim.k * camAnim.k : 1 - Math.pow(-2 * camAnim.k + 2, 2) / 2;
    camera.position.lerpVectors(camAnim.p0, camAnim.p, e); controls.target.lerpVectors(camAnim.t0, camAnim.t, e);
    if (camAnim.k >= 1) camAnim = null;
  }
  if (!walk) controls.update();
  grade.uniforms.seed.value = (performance.now() % 1000) / 10;
  grassUniforms.time.value = performance.now() / 1000; grassUniforms.camPos.value.copy(camera.position);
  if (usePost) composer.render(); else renderer.render(scene, camera);
  frames++; const now = performance.now();
  if (now - t0 > 1000) {
    const fps = frames * 1000 / (now - t0);
    if (fps < 42 && quality < 4 && !document.hidden && !navigator.webdriver) { if (++slowFor >= 3) { stepDown(); slowFor = 0; } } else slowFor = 0;
    $('#stats').textContent = `${Math.round(fps)} fps · 화질 ${QUALITY_NAMES[quality]}`; frames = 0; t0 = now; }
});
$('#veil').style.opacity = 0; setTimeout(() => $('#veil').remove(), 600);
window.__look = { setCam, scene, renderer, camera, controls, THREE };
</script>
