# 안드로이드 APK 빌드: 바로 폰에 깔아 볼 수 있는 release APK (arm64) 를 만들어 Actions 결과물(Artifacts)로 올린다.
# 서명: 저장소 Secrets 에 미리보기 키가 있으면 그 키로 (기존 설치본 위에 업데이트), 없으면 기본 debug 키로
#       (그때는 예전 설치본을 지우고 새로 깔아야 한다 — 서명이 달라서).
#   ANDROID_PREVIEW_KEYSTORE_BASE64  mobile/.credentials/junseo-preview.jks 를 base64 로
#   ANDROID_PREVIEW_KEY_PASSWORD     mobile/.credentials/android-preview.json 의 password
#   GOOGLE_SERVICES_JSON_BASE64      google-services.json 을 base64 로 (없으면 푸시 없이 빌드)
name: Android APK

on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Firebase 설정 (Secrets 에 있으면)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p .credentials/firebase
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > .credentials/firebase/google-services.json
            echo "GOOGLE_SERVICES_JSON=$PWD/.credentials/firebase/google-services.json" >> "$GITHUB_ENV"
          else
            echo "google-services.json 없음: 푸시(FCM) 없이 빌드해요"
          fi

      - name: Android 프로젝트 만들기 (expo prebuild)
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: 빌드 (release, arm64)
        run: ./android/gradlew -p android :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --console=plain

      - name: 서명
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          ANDROID_PREVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$ANDROID_PREVIEW_KEYSTORE_BASE64" ] && [ -n "$ANDROID_PREVIEW_KEY_PASSWORD" ]; then
            OUT="junseo-$VERSION-${GITHUB_SHA::7}-android-arm64.apk"
            echo "$ANDROID_PREVIEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/preview.jks" --ks-key-alias junseo-preview \
              --ks-pass env:ANDROID_PREVIEW_KEY_PASSWORD --key-pass env:ANDROID_PREVIEW_KEY_PASSWORD --out "$OUT" "$APK"
            rm -f "$RUNNER_TEMP/preview.jks"
            echo "미리보기 키로 서명: 기존 설치본 위에 업데이트돼요"
          else
            OUT="junseo-$VERSION-${GITHUB_SHA::7}-android-arm64-debugkey.apk"
            cp "$APK" "$OUT"
            echo "기본 debug 키로 서명: 예전 junseo 를 지우고 깔아 주세요"
          fi
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: junseo-android-apk
          path: mobile/${{ env.APK }}
          retention-days: 14
          if-no-files-found: error
