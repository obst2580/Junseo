<!doctype html><html><head><meta charset='utf-8'><title>A씨 정치자금 선고 연기 이게 말이 됩니까</title></head><body><div class="content02"><div class="writerProfile"><span class="countGroup">추천 <em class="now_num">95</em></span></div><div class="bodyCont"><p>선고 당일에 연기라니요</p><p>검찰이 새 증거를 냈다는데 재판부가 받아준 게 이해가 안 됩니다.</p></div></div><div class="commentArea"><ul class="basiclist"><li><dl><dt><span class="author">닉0</span><span class="date">10.08 14:50</span></dt><dd class="txt">시간 끌기 아닌가요? 다음 달로 미루면 또 흐지부지될 겁니다</dd><dd class="update"><button class="good">추천 <span>44</span></button></dd></dl></li><li><dl><dt><span class="author">닉1</span><span class="date">10.08 14:51</span></dt><dd class="txt">사법부가 정치인 재판만 유독 느립니다</dd><dd class="update"><button class="good">추천 <span>33</span></button></dd></dl></li><li><dl><dt><span class="author">닉2</span><span class="date">10.08 14:52</span></dt><dd class="txt">새 증거가 오히려 유죄 쪽이면 좋은 거 아닌가요</dd><dd class="update"><button class="good">추천 <span>18</span></button></dd></dl></li></ul></div><footer class='footer'><a href='/terms'>이용약관</a> 시연용 가상 게시글</footer></body></html>
