# build.py가 생성 — 직접 수정하지 말 것
routes:
- match: https://www\.yna\.co\.kr/rss/politics\.xml
  file: rss/yna_politics.xml
- match: https://www\.yna\.co\.kr/rss/economy\.xml
  file: rss/yna_economy.xml
- match: https://www\.yna\.co\.kr/rss/international\.xml
  file: rss/yna_intl.xml
- match: https://feeds\.bbci\.co\.uk/news/world/rss\.xml
  file: rss/bbc.xml
- match: https://press\.example\.go\.kr/rss/press\.xml
  file: rss/press.xml
- match: (openapi\.naver\.com/v1/search/news\.json|naverapihub\.apigw\.ntruss\.com/search/v1/news)
  generate: naver_news
  data: naver/index.json
- match: https://damoang\.net/free\?page=1
  file: community/다모앙.html
  content_type: text/html; charset=utf-8
- match: https://www\.bobaedream\.co\.kr/list\?code=politic\&page=1
  file: community/보배드림.html
  content_type: text/html; charset=utf-8
- match: https://www\.ppomppu\.co\.kr/zboard/zboard\.php\?id=politics\&page=1
  file: community/뽐뿌.html
  content_type: text/html; charset=utf-8
- match: https://theqoo\.net/hot\?page=1
  file: community/더쿠.html
  content_type: text/html; charset=utf-8
- match: /robots\.txt$
  generate: robots_allow
- match: youtube/v3/playlistItems
  params:
    playlistId: UUcompAAAAAAAAAAAAAAAAAA
  file: youtube/playlist_UCcompAAAAAAAAAAAAAAAAAA.json
- match: youtube/v3/playlistItems
  params:
    playlistId: UUcompBBBBBBBBBBBBBBBBBB
  file: youtube/playlist_UCcompBBBBBBBBBBBBBBBBBB.json
- match: youtube/v3/videos
  params:
    part: snippet,statistics
  generate: youtube_stats
  data: youtube/stats.json
- match: youtube/v3/videos
  generate: youtube_videos
- match: youtube/v3/search
  generate: youtube_search
- match: googleapis\.com/customsearch/v1
  generate: google_image
- match: (openapi\.naver\.com/v1/search/image|naverapihub\.apigw\.ntruss\.com/search/v1/image)
  generate: naver_image
- match: commons\.wikimedia\.org/w/api\.php
  generate: wikimedia
- match: img\.example\.com/
  generate: image
- match: hooks\.slack\.com/
  file: slack_ok.txt
  content_type: text/plain
