[project]
name = "newsclip"
version = "0.1.0"
description = "대본·자막 → 이미지·영상 자동 수집 → 프리미어용 FCP XML"
requires-python = ">=3.11"
dependencies = [
    "studio-core",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.0",
    "pillow>=10.0",
    "yt-dlp>=2025.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24", "torch>=2.2"]

[project.scripts]
newsclip = "newsclip.cli:app"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsclip"]
