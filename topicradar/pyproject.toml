[project]
name = "topicradar"
version = "0.1.0"
description = "주제 선정 + 대본 초안 (아침 프리뷰 / 저녁 리뷰 / 주간 심층)"
requires-python = ">=3.11"
dependencies = [
    "studio-core",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlmodel>=0.0.22",
    "rich>=13.0",
    "feedparser>=6.0",
    "pyyaml>=6.0",
]

[project.scripts]
topicradar = "topicradar.cli:app"

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topicradar"]
